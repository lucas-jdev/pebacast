agenda:
  # fila: o próximo episódio verificado de qualquer saga, começando pela publicada há mais tempo.
  # saga_unica e rotacao_semanal: só a saga fixa ou a do dia da semana.
  modo: fila
  fila: [software, solucoes, sistemas, dados, infraestrutura, seguranca, corporativa]
  saga_unica: software
  rotacao_semanal:
    segunda: software
    terca: solucoes
    quarta: sistemas
    quinta: dados
    sexta: infraestrutura
    sabado: seguranca
    domingo: corporativa

episodio:
  duracao_minutos: { min: 15, max: 20 }
  palavras_alvo: { min: 2300, max: 3000 }
  idioma: pt-BR
  exigir_referencias_verificadas: true

noticias:
  janelas_dias: [7, 30, 60]
  nota_minima_relevancia: 7
  fallback: cenario_hipotetico

revisao:
  max_ciclos: 2
  vereditos_reprovam: [incorreta, imprecisa]
  falhar_fechado: true

feedback:
  ultimos_por_saga: 5

tts:
  principal: gemini-3.8-flash-tts
  fallback: kokoro
  idioma: pt-BR
  max_caracteres_por_bloco: 4000
  # Só para o TTS: o roteiro e o feed mantêm a grafia original (src/podcast/pronuncia.py).
  pronuncia:
    - termo: Pebacast
      # "Peba" vem do tatu-peba: E aberto, PÉ-ba-cast. No teste de 2026-11-07, só a
      # instrução soou melhor que sem ajuste e que com a grafia "Pébacast".
      instrucao: >-
        Pronuncie "Pebacast" com o E aberto, como em "tatu-peba": PÉ-ba-cast.

audio:
  formato: mp3
  canais: 1
  bitrate_kbps: 64
  normalizacao: loudnorm
  # Faixa de terceiros: fica cifrada no repositório (assets/vinheta.mp3.gpg) e é
  # decifrada no Actions com o secret VINHETA_SENHA. Ver docs/vinheta.md.
  vinheta:
    arquivo: assets/vinheta.mp3
    credito: Vinheta "Indie Rock", de AtlasAudio, via Pixabay (https://pixabay.com/pt/users/atlasaudio-54514918/)
    volume: 0.7
    sobreposicao_s: 1.5    # a primeira fala entra 1,5 s antes do fim da abertura
    abertura:              # introdução da faixa, antes de a banda entrar
      inicio_s: 1.0
      duracao_s: 9.0
      fade_entrada_s: 0.3
      fade_saida_s: 3.0
    encerramento:          # final natural da faixa (batida em 90,8 s e decaimento)
      inicio_s: 85.0
      duracao_s: 11.0
      fade_entrada_s: 1.0
      fade_saida_s: 0.5

publicacao:
  audio: github_releases
  feed: github_pages
  aviso_ia: true

feed:
  titulo: Pebacast
  descricao: >-
    Podcast diário para estudar arquitetura de software, soluções, sistemas,
    dados, infraestrutura, segurança e arquitetura corporativa. Cada episódio
    é um diálogo de 15 a 20 minutos que termina com um desafio prático.
    Conteúdo gerado por inteligência artificial e revisado contra as fontes
    citadas.
  autor: Lucas Fernandes
  # Público no feed: o Spotify e o Apple mandam o código de verificação para cá.
  email_dono: lucas.jdev1@gmail.com
  # Relativa ao url_site; gerada de assets/capa.svg por scripts/gerar_imagens.sh.
  capa: capa.jpg
  url_site: https://lucas-jdev.github.io/pebacast/
  url_repositorio: https://github.com/lucas-jdev/pebacast
  idioma: pt-br
  categoria: Technology
  licenca: CC BY 4.0

site:
  # Descrição curta das páginas para buscadores e prévias de link (o Google corta perto de 155 caracteres).
  descricao: >-
    Podcast diário de arquitetura de software: um diálogo de 15 a 20 minutos
    por dia, com um desafio prático no fim de cada episódio.
  # Relativa ao url_site; gerada de assets/og.svg por scripts/gerar_imagens.sh.
  imagem_compartilhamento: og.jpg
  # Código do site no GoatCounter (o "xxx" de xxx.goatcounter.com): analytics sem cookie.
  # Vazio, nenhum script de analytics é carregado.
  goatcounter: ""
