agenda:
  # fila: o próximo episódio verificado de qualquer saga, começando pela publicada há mais tempo.
  # saga_unica e rotacao_semanal: só a saga fixa ou a do dia da semana.
  modo: fila
  fila: [software, solucoes, sistemas, dados, infraestrutura, seguranca, corporativa]
  saga_unica: software
  rotacao_semanal:
    segunda: software
    terca: solucoes
    quarta: sistemas
    quinta: dados
    sexta: infraestrutura
    sabado: seguranca
    domingo: corporativa

episodio:
  duracao_minutos: { min: 15, max: 20 }
  palavras_alvo: { min: 2300, max: 3000 }
  idioma: pt-BR
  exigir_referencias_verificadas: true

noticias:
  janelas_dias: [7, 30, 60]
  nota_minima_relevancia: 7
  fallback: cenario_hipotetico

revisao:
  max_ciclos: 2
  vereditos_reprovam: [incorreta, imprecisa]
  falhar_fechado: true

feedback:
  ultimos_por_saga: 5

tts:
  principal: gemini-3.8-flash-tts
  fallback: kokoro
  idioma: pt-BR
  max_caracteres_por_bloco: 4000
  gemini:
    timeout_s: 180   # teto por requisição; um bloco de 4.000 caracteres leva bem menos
  # Só para o TTS: o roteiro e o feed mantêm a grafia original (src/podcast/pronuncia.py).
  pronuncia:
    - termo: Pebacast
      # "Peba" vem do tatu-peba: E aberto, PÉ-ba-cast. No teste de 2026-11-07, só a
      # instrução soou melhor que sem ajuste e que com a grafia "Pébacast". No teste cego de
      # 2026-11-24 (experimentos/teste-pronuncia), a instrução, a grafia "Péba-cast" e as duas
      # juntas acertaram 4 de 4 cada; fica a instrução, e o QA de pronúncia vigia os deslizes.
      instrucao: >-
        Pronuncie "Pebacast" com o E aberto, como em "tatu-peba": PÉ-ba-cast.
    # Especial do Prumo, 2026-11-17: o artigo emendava na letra A e a transcrição ouvia "a GPL".
    # Com a vírgula de respiro, os dois modelos acertaram.
    - termo: a AGPL
      escrever_como: a, á-gê-pê-éle
    # Sobrenome em inglês (Barry Boehm).
    - termo: Boehm
      escrever_como: Bím
    # A letra isolada virava artigo ou sumia. Só com maiúscula, para "o fluxo a gente decide" ficar intacto.
    - termo: fluxos A, B e C
      escrever_como: fluxos Á, Bê e Cê
      diferenciar_maiusculas: true
    - termo: fluxo A
      escrever_como: fluxo Á
      diferenciar_maiusculas: true
    - termo: fluxo B
      escrever_como: fluxo Bê
      diferenciar_maiusculas: true
    - termo: fluxo C
      escrever_como: fluxo Cê
      diferenciar_maiusculas: true

audio:
  formato: mp3
  canais: 1
  bitrate_kbps: 64
  # Ganho único até -16 LUFS e limitador de pico real em -1,5 dBTP (src/podcast/audio.py).
  normalizacao: ganho_unico_com_limitador
  # QA do MP3 montado (src/podcast/qualidade_audio.py). Reprovar não segura a publicação:
  # abre uma issue `incidente`, que fecha quando o áudio do episódio passar.
  qualidade:
    loudness_lufs: -16           # o alvo da montagem
    tolerancia_lu: 1
    pico_maximo_dbtp: -1.0       # o alvo da montagem é -1,5; a folga cobre o codificador MP3
    musica_acima_da_fala_lu: 0   # abertura e encerramento não passam da loudness da fala
    pausa_maxima_s: 0.6          # na troca de blocos do TTS
    silencio_dbfs: -50           # abaixo disso conta como pausa
  # Faixa de terceiros: fica cifrada no repositório (assets/vinheta.mp3.gpg) e é
  # decifrada no Actions com o secret VINHETA_SENHA. Ver docs/vinheta.md.
  vinheta:
    arquivo: assets/vinheta.mp3
    credito: Vinheta "Indie Rock", de AtlasAudio, via Pixabay (https://pixabay.com/pt/users/atlasaudio-54514918/)
    abaixo_da_fala_lu: 2   # no MP3 final, a abertura e o encerramento ficam 2 LU (até 2,5) abaixo da fala, medidos como o QA mede
    sobreposicao_s: 1.5    # a primeira fala entra 1,5 s antes do fim da abertura
    abertura:              # introdução da faixa, antes de a banda entrar
      inicio_s: 1.0
      duracao_s: 9.0
      fade_entrada_s: 0.3
      fade_saida_s: 3.0
    encerramento:          # final natural da faixa (batida em 90,8 s e decaimento)
      inicio_s: 85.0
      duracao_s: 11.0
      fade_entrada_s: 1.0
      fade_saida_s: 0.5

# QA de texto (#69, src/podcast/qualidade_texto.py): transcreve a fala do MP3 com dois modelos e
# só avisa da divergência com o roteiro que os dois ouviram igual. Não segura a publicação.
qualidade_texto:
  modelos: [gemini-3.6-flash, gemini-3.5-flash]
  timeout_s: 300
  # O episódio inteiro numa requisição saía cortado (se-002: os dois modelos pararam em 69%).
  # Cada modelo transcreve janelas de até 5 min, cortadas nas trocas de bloco.
  janela_maxima_s: 300
  # Transcrição com menos palavras que isso, em relação ao roteiro, conta como "não rodou".
  cobertura_minima: 0.85
  # Forma falada (uma palavra) → forma escrita: não é erro do TTS dizer "pra" onde o roteiro tem "para".
  equivalencias:
    pra: para
    pro: para o
    pros: para os
    tá: está
    tô: estou
    tava: estava
    cê: você
    # Contrações da fala que apareceram nos incidentes do QA (#132).
    pras: para as
    prum: para um
    pruma: para uma
    perai: pera aí
    dum: de um
    duma: de uma

# QA de pronúncia (#107, src/podcast/qualidade_pronuncia.py): os dois modelos ouvem cada janela da fala
# e julgam os termos de tts.pronuncia que têm instrucao. Só avisa o erro que os dois marcam.
qualidade_pronuncia:
  modelos: [gemini-3.6-flash, gemini-3.5-flash]
  timeout_s: 300
  janela_maxima_s: 300

publicacao:
  audio: github_releases
  feed: github_pages
  aviso_ia: true

feed:
  titulo: Pebacast
  descricao: >-
    Podcast diário para estudar arquitetura de software, soluções, sistemas,
    dados, infraestrutura, segurança e arquitetura corporativa. Cada episódio
    é um diálogo de 15 a 20 minutos que termina com um desafio prático.
    Conteúdo gerado por inteligência artificial, com fontes escolhidas à mão e
    afirmações revisadas por uma segunda IA.
  autor: Lucas Fernandes
  # Público no feed: o Spotify e o Apple mandam o código de verificação para cá.
  email_dono: lucas.jdev1@gmail.com
  # Relativa ao url_site; gerada de assets/capa.svg por scripts/gerar_imagens.sh.
  # O nome muda junto com a arte: apps de podcast guardam a capa em cache pela URL.
  capa: capa-kraft.jpg
  url_site: https://lucas-jdev.github.io/pebacast/
  url_repositorio: https://github.com/lucas-jdev/pebacast
  idioma: pt-br
  categoria: Technology
  licenca: CC BY 4.0

site:
  # Descrição curta das páginas para buscadores e prévias de link. Até 125 caracteres: é o que as
  # prévias de redes sociais mostram sem cortar no celular (tests/test_site.py confere).
  descricao: >-
    Podcast diário de arquitetura de software: 15 a 20 minutos por dia, com
    um desafio prático no fim de cada episódio.
  # Relativa ao url_site; gerada de assets/og.svg por scripts/gerar_imagens.sh.
  imagem_compartilhamento: og.jpg
  # Código do site no GoatCounter (o "xxx" de xxx.goatcounter.com): analytics sem cookie.
  # Vazio, nenhum script de analytics é carregado.
  goatcounter: ""
  # Liga o carimbo "beta" no cabeçalho, a seção "Ainda é beta" na Sobre, o "No Spotify em breve" e o aviso
  # no fim da descrição do feed. No lançamento, é só desligar.
  beta: true
  # Página do programa no Spotify, que lê este mesmo feed. Preenchida, a seção de assinar ganha o botão
  # "Ouvir no Spotify" e a série ganha o sameAs; o "em breve" some. Só aceita https://open.spotify.com/show/<id>.
  spotify: https://open.spotify.com/show/5EMHP24shu7Y7fhfRbLkUz
  # Quem faz o podcast, na página sobre/ e no JSON-LD de todas as páginas (Person com o mesmo @id).
  # A bio é do Lucas e pode ser reescrita sem mexer no código; vazia, a página mostra só nome e links.
  # Os links viram o sameAs da Person: só https.
  criador:
    nome: Lucas Fernandes
    papel: Desenvolvedor full stack · inteligência industrial
    cidade: Natal, RN
    # Relativa ao url_site, em site/: o retrato redondo do card "Quem faz" e o image da Person.
    foto: criador.jpg
    bio: >-
      Lucas Fernandes é desenvolvedor full stack em Natal (RN) e atua com
      inteligência industrial. Criou o Pebacast como o próprio roteiro de estudo
      para chegar a arquiteto de software: entender os conceitos a fundo e saber
      quando aplicar cada um, num tempo em que a IA escreve boa parte do código.
      Roteiros, pipeline e site são abertos no GitHub.
    links:
      - rotulo: GitHub
        url: https://github.com/lucas-jdev
      - rotulo: LinkedIn
        url: https://www.linkedin.com/in/lucas-jdev
  # URL do Worker de votos (votos/, docs/votos.md). Vazio: o site não mostra o curti / não curti.
  votos_api: "https://pebacast-votos.lucas-jdev1.workers.dev"
  # Códigos de verificação de dono, que viram meta tags em todas as páginas (docs/pipeline.md,
  # "Entrar no índice dos buscadores"). Vazio, a meta tag não aparece.
  verificacao:
    google: 55IhAYxidRMWE6Xk53Mzg80fQmW1baH9p53XJ0OVvH0
    bing: 9F3D1F5A07690E838800E30C9CB70CC6
  # Chave do IndexNow, gerada no Bing Webmaster Tools. Não é segredo: o site a publica em
  # <url_site>/<chave>.txt, por desenho do protocolo. Vazia, ninguém é avisado.
  indexnow: 390edd292511e818b3e97747f5bfb9e5
