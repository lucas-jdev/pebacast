agenda:
  modo: saga_unica
  saga_unica: software
  rotacao_semanal:
    segunda: software
    terca: solucoes
    quarta: sistemas
    quinta: dados
    sexta: infraestrutura
    sabado: seguranca
    domingo: corporativa

episodio:
  duracao_minutos: { min: 15, max: 20 }
  palavras_alvo: { min: 2300, max: 3000 }
  idioma: pt-BR
  exigir_referencias_verificadas: true

noticias:
  janelas_dias: [7, 30, 60]
  nota_minima_relevancia: 7
  fallback: cenario_hipotetico

revisao:
  max_ciclos: 2
  vereditos_reprovam: [incorreta, imprecisa]
  falhar_fechado: true

feedback:
  ultimos_por_saga: 5

tts:
  principal: gemini-3.8-flash-tts
  fallback: kokoro
  idioma: pt-BR
  max_caracteres_por_bloco: 4000

audio:
  formato: mp3
  canais: 1
  bitrate_kbps: 64
  normalizacao: loudnorm
  # Faixa de terceiros: fica cifrada no repositório (assets/vinheta.mp3.gpg) e é
  # decifrada no Actions com o secret VINHETA_SENHA. Ver docs/vinheta.md.
  vinheta:
    arquivo: assets/vinheta.mp3
    inicio_s: 0          # segundo da faixa onde o recorte começa
    duracao_s: 8         # tamanho do recorte
    fade_entrada_s: 0.5
    fade_saida_s: 3      # a música abaixa nos últimos 3 s do recorte
    sobreposicao_s: 1.5  # a primeira fala entra 1,5 s antes do fim do recorte
    volume: 0.7
    encerramento: true   # repete o recorte depois da última fala

publicacao:
  audio: github_releases
  feed: github_pages
  aviso_ia: true

feed:
  titulo: pebacast
  descricao: >-
    Podcast diário para estudar arquitetura de software, soluções, sistemas,
    dados, infraestrutura, segurança e arquitetura corporativa. Cada episódio
    é um diálogo de 15 a 20 minutos que termina com um desafio prático.
    Conteúdo gerado por inteligência artificial e revisado contra as fontes
    citadas.
  autor: Lucas Mateus
  url_site: https://lucas-jdev.github.io/pebacast/
  url_repositorio: https://github.com/lucas-jdev/pebacast
  idioma: pt-br
  categoria: Technology
  licenca: CC BY 4.0
