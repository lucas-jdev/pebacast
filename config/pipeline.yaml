agenda:
  modo: saga_unica
  saga_unica: software
  rotacao_semanal:
    segunda: software
    terca: solucoes
    quarta: sistemas
    quinta: dados
    sexta: infraestrutura
    sabado: seguranca
    domingo: corporativa

episodio:
  duracao_minutos: { min: 15, max: 20 }
  palavras_alvo: { min: 2300, max: 3000 }
  idioma: pt-BR
  exigir_referencias_verificadas: true

noticias:
  janelas_dias: [7, 30, 60]
  nota_minima_relevancia: 7
  fallback: cenario_hipotetico

revisao:
  max_ciclos: 2
  vereditos_reprovam: [incorreta, imprecisa]
  falhar_fechado: true

feedback:
  ultimos_por_saga: 5

tts:
  principal: gemini-3.8-flash-tts
  fallback: kokoro
  idioma: pt-BR
  max_caracteres_por_bloco: 4000
  # Só para o TTS: o roteiro e o feed mantêm a grafia original (src/podcast/pronuncia.py).
  pronuncia:
    - termo: Pebacast
      # "Peba" vem do tatu-peba: E aberto, PÉ-ba-cast. A grafia alternativa fica
      # desligada até o teste com o Gemini confirmar se a instrução basta.
      # escrever_como: Pébacast
      instrucao: >-
        Pronuncie "Pebacast" com o E aberto, como em "tatu-peba": PÉ-ba-cast.

audio:
  formato: mp3
  canais: 1
  bitrate_kbps: 64
  normalizacao: loudnorm
  # Faixa de terceiros: fica cifrada no repositório (assets/vinheta.mp3.gpg) e é
  # decifrada no Actions com o secret VINHETA_SENHA. Ver docs/vinheta.md.
  vinheta:
    arquivo: assets/vinheta.mp3
    credito: Vinheta "Indie Rock", de AtlasAudio, via Pixabay (https://pixabay.com/pt/users/atlasaudio-54514918/)
    volume: 0.7
    sobreposicao_s: 1.5    # a primeira fala entra 1,5 s antes do fim da abertura
    abertura:              # introdução da faixa, antes de a banda entrar
      inicio_s: 1.0
      duracao_s: 9.0
      fade_entrada_s: 0.3
      fade_saida_s: 3.0
    encerramento:          # final natural da faixa (batida em 90,8 s e decaimento)
      inicio_s: 85.0
      duracao_s: 11.0
      fade_entrada_s: 1.0
      fade_saida_s: 0.5

publicacao:
  audio: github_releases
  feed: github_pages
  aviso_ia: true

feed:
  titulo: pebacast
  descricao: >-
    Podcast diário para estudar arquitetura de software, soluções, sistemas,
    dados, infraestrutura, segurança e arquitetura corporativa. Cada episódio
    é um diálogo de 15 a 20 minutos que termina com um desafio prático.
    Conteúdo gerado por inteligência artificial e revisado contra as fontes
    citadas.
  autor: Lucas Mateus
  url_site: https://lucas-jdev.github.io/pebacast/
  url_repositorio: https://github.com/lucas-jdev/pebacast
  idioma: pt-br
  categoria: Technology
  licenca: CC BY 4.0
