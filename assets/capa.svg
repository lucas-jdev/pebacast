<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <!-- Capa do Pebacast no estilo cordel do site. Fonte da arte; o JPG publicado sai de scripts/gerar_imagens.sh. -->
  <defs>
    <style>
      @font-face { font-family: "Alfa Slab One"; src: url("../site/fontes/alfa-slab-one-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Literata"; font-weight: 700; src: url("../site/fontes/literata-latin-700-normal.woff2") format("woff2"); }
      .nome { font-family: "Alfa Slab One", Georgia, serif; fill: #15110c; }
      .lema { font-family: "Literata", Georgia, serif; font-weight: 700; fill: #15110c; letter-spacing: 0.06em; }
    </style>
    <filter id="papel" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.35" numOctaves="2" seed="4" result="ruido"/>
      <feColorMatrix in="ruido" values="0 0 0 0 0.08  0 0 0 0 0.07  0 0 0 0 0.05  0 0 0 0.1 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <pattern id="hachura" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="40" height="40" fill="#d8b98a"/>
      <rect width="5" height="40" fill="#15110c" opacity="0.13"/>
    </pattern>
    <!-- O mesmo tatu-peba do site (src/podcast/site.py), com os cortes na cor da capa. -->
    <symbol id="peba" viewBox="0 0 128 80">
      <path fill="#15110c" d="M104 55c9 1 16 6 22 15-8-3-15-6-23-7z"/>
      <path fill="#15110c" d="M36 59h8v9a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zm14 0h8v9a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zm34 0h8v9a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zm14 0h8v9a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2z"/>
      <path fill="#15110c" d="M28 60c0-27 19-44 42-44s40 17 40 44z"/>
      <path fill="#15110c" d="M36 44c-9-2-18 2-25 8L3 59c-1 1-1 4 2 4h30z"/>
      <path fill="#15110c" d="M33 47c-3-6-2-13 2-15 3 3 3 10 0 15z"/>
      <g fill="none" stroke="#d8b98a" stroke-linecap="round">
        <path stroke-width="2.4" d="M50 23c-3 11-4 24-4 34M61 18c-2 12-2 26-2 39M72 17c0 13 0 27 0 40M83 19c2 12 2 25 2 38M94 25c3 10 4 21 4 32"/>
        <path stroke-width="1.6" d="M32 56c24-3 50-3 76 0"/>
        <path stroke-width="1.4" d="M38 30l4 3m-6 4 4 2m62-9-4 3m6 4-4 2"/>
      </g>
      <circle cx="16" cy="54" r="1.8" fill="#d8b98a"/>
    </symbol>
  </defs>

  <rect width="3000" height="3000" fill="#f4ecdd"/>
  <rect width="3000" height="3000" fill="#f4ecdd" filter="url(#papel)"/>

  <!-- O folheto: sombra dura, capa hachurada e o fio interno da moldura -->
  <rect x="230" y="230" width="2620" height="2620" fill="#15110c"/>
  <rect x="150" y="150" width="2620" height="2620" fill="url(#hachura)" stroke="#15110c" stroke-width="40"/>
  <rect x="270" y="270" width="2380" height="2380" fill="none" stroke="#15110c" stroke-width="14"/>

  <text class="lema" x="1460" y="560" text-anchor="middle" font-size="118">PODCAST DE ARQUITETURA</text>

  <!-- O peba em xilogravura, sobre o chão -->
  <use href="#peba" x="400" y="640" width="2120" height="1325"/>
  <path d="M430 1960h2060" stroke="#15110c" stroke-width="26" stroke-linecap="round"/>

  <rect x="905" y="2404" width="1110" height="40" fill="#f2c53d"/>
  <text class="nome" x="1460" y="2380" text-anchor="middle" font-size="430">Pebacast</text>

  <!-- Faixa em zigue-zague, como no site -->
  <path d="M520 2610l50-40 50 40 50-40 50 40 50-40 50 40 50-40 50 40 50-40 50 40 50-40 50 40 50-40 50 40 50-40 50 40 50-40 50 40 50-40 50 40 50-40 50 40 50-40 50 40 50-40 50 40 50-40 50 40 50-40 50 40 50-40 50 40 50-40 50 40 50-40 50 40" fill="none" stroke="#15110c" stroke-width="14" stroke-linejoin="round"/>
</svg>
