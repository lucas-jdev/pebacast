<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000" width="3000" height="3000">
  <!-- Capa do Pebacast. Fonte da arte; o JPG publicado sai de scripts/gerar_capa.sh. -->
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..800,50&amp;family=Instrument+Sans:wght@400..700&amp;display=block");
      .nome { font-family: "Fraunces", Georgia, serif; font-weight: 750; font-variation-settings: "SOFT" 50, "opsz" 144; letter-spacing: -0.02em; }
      .lema { font-family: "Instrument Sans", "Segoe UI", sans-serif; font-weight: 600; letter-spacing: 0.14em; }
    </style>
    <!-- O mesmo tatu-peba do site (src/podcast/site.py), com os cortes na cor do fundo. -->
    <symbol id="peba" viewBox="0 0 128 80">
      <path fill="#f4ecdd" d="M104 55c9 1 16 6 22 15-8-3-15-6-23-7z"/>
      <path fill="#f4ecdd" d="M36 59h8v9a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zm14 0h8v9a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zm34 0h8v9a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zm14 0h8v9a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2z"/>
      <path fill="#f4ecdd" d="M28 60c0-27 19-44 42-44s40 17 40 44z"/>
      <path fill="#f4ecdd" d="M36 44c-9-2-18 2-25 8L3 59c-1 1-1 4 2 4h30z"/>
      <path fill="#f4ecdd" d="M33 47c-3-6-2-13 2-15 3 3 3 10 0 15z"/>
      <g fill="none" stroke="#b4432a" stroke-linecap="round">
        <path stroke-width="2.4" d="M50 23c-3 11-4 24-4 34M61 18c-2 12-2 26-2 39M72 17c0 13 0 27 0 40M83 19c2 12 2 25 2 38M94 25c3 10 4 21 4 32"/>
        <path stroke-width="1.6" d="M32 56c24-3 50-3 76 0"/>
        <path stroke-width="1.4" d="M38 30l4 3m-6 4 4 2m62-9-4 3m6 4-4 2"/>
      </g>
      <circle cx="16" cy="54" r="1.8" fill="#b4432a"/>
    </symbol>
  </defs>

  <!-- Céu de urucum, com cortes de goiva como na xilogravura -->
  <rect width="3000" height="3000" fill="#b4432a"/>
  <g fill="none" stroke="#96341f" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <path d="M260 330c240-22 470-22 700 0M1820 250c300-24 600-24 900 0M2140 430c180-16 360-16 540 0M380 520c160-14 320-14 480 0"/>
  </g>
  <circle cx="2420" cy="700" r="230" fill="#d9982b"/>

  <!-- O peba sobre o chão -->
  <use href="#peba" x="330" y="560" width="2340" height="1462"/>
  <path d="M0 1840h3000" stroke="#1d1814" stroke-width="18"/>
  <g fill="none" stroke="#5d6b3a" stroke-width="22" stroke-linecap="round">
    <path d="M190 1840c8-90 40-150 100-190m-50 190c0-70-30-120-90-160M2650 1840c10-100 50-170 120-210m-70 210c-6-80-46-130-104-160"/>
  </g>

  <!-- A terra, onde mora o nome -->
  <rect y="1849" width="3000" height="1151" fill="#1d1814"/>
  <g fill="#3a2a1e">
    <circle cx="300" cy="2860" r="30"/><circle cx="2700" cy="2800" r="24"/><ellipse cx="2480" cy="2020" rx="44" ry="24"/><ellipse cx="520" cy="2010" rx="36" ry="20"/>
  </g>
  <text class="nome" x="1500" y="2510" text-anchor="middle" font-size="600" fill="#f4ecdd">Pebacast</text>
  <text class="lema" x="1500" y="2760" text-anchor="middle" font-size="118" fill="#d9982b">ARQUITETURA, UM EPISÓDIO POR DIA</text>
</svg>
