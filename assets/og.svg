<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Imagem de compartilhamento (Open Graph). Fonte da arte; o JPG publicado sai de scripts/gerar_imagens.sh. -->
  <defs>
    <style>
      @font-face { font-family: "Alfa Slab One"; src: url("../site/fontes/alfa-slab-one-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Literata"; font-weight: 600; src: url("../site/fontes/literata-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Literata"; font-weight: 700; src: url("../site/fontes/literata-latin-700-normal.woff2") format("woff2"); }
      .titulo { font-family: "Alfa Slab One", Georgia, serif; fill: #15110c; }
      .texto { font-family: "Literata", Georgia, serif; font-weight: 600; fill: #15110c; }
      .rotulo { font-family: "Literata", Georgia, serif; font-weight: 700; fill: #15110c; letter-spacing: 0.04em; }
    </style>
    <filter id="papel" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="ruido"/>
      <feColorMatrix in="ruido" values="0 0 0 0 0.08  0 0 0 0 0.07  0 0 0 0 0.05  0 0 0 0.09 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <pattern id="hachura" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="16" height="16" fill="#f2a7bf"/>
      <rect width="2" height="16" fill="#15110c" opacity="0.13"/>
    </pattern>
    <!-- O mesmo tatu-peba do site (src/podcast/site.py), com os cortes na cor da capa. -->
    <symbol id="peba" viewBox="0 0 128 80">
      <path fill="#15110c" d="M104 55c9 1 16 6 22 15-8-3-15-6-23-7z"/>
      <path fill="#15110c" d="M36 59h8v9a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zm14 0h8v9a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zm34 0h8v9a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2zm14 0h8v9a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2z"/>
      <path fill="#15110c" d="M28 60c0-27 19-44 42-44s40 17 40 44z"/>
      <path fill="#15110c" d="M36 44c-9-2-18 2-25 8L3 59c-1 1-1 4 2 4h30z"/>
      <path fill="#15110c" d="M33 47c-3-6-2-13 2-15 3 3 3 10 0 15z"/>
      <g fill="none" stroke="#f2a7bf" stroke-linecap="round">
        <path stroke-width="2.4" d="M50 23c-3 11-4 24-4 34M61 18c-2 12-2 26-2 39M72 17c0 13 0 27 0 40M83 19c2 12 2 25 2 38M94 25c3 10 4 21 4 32"/>
        <path stroke-width="1.6" d="M32 56c24-3 50-3 76 0"/>
        <path stroke-width="1.4" d="M38 30l4 3m-6 4 4 2m62-9-4 3m6 4-4 2"/>
      </g>
      <circle cx="16" cy="54" r="1.8" fill="#f2a7bf"/>
    </symbol>
  </defs>

  <rect width="1200" height="630" fill="#f4ecdd"/>
  <rect width="1200" height="630" fill="#f4ecdd" filter="url(#papel)"/>

  <!-- Capa do folheto: o peba em xilogravura -->
  <rect x="58" y="58" width="430" height="514" fill="#15110c"/>
  <rect x="46" y="46" width="430" height="514" fill="url(#hachura)" stroke="#15110c" stroke-width="7"/>
  <rect x="66" y="66" width="390" height="474" fill="none" stroke="#15110c" stroke-width="3"/>
  <use href="#peba" x="78" y="180" width="366" height="229"/>
  <path d="M86 432h350" stroke="#15110c" stroke-width="5" stroke-linecap="round"/>
  <text class="titulo" x="261" y="500" text-anchor="middle" font-size="46">Pebacast</text>

  <!-- Chamada -->
  <text class="rotulo" x="536" y="128" font-size="24">PODCAST DIÁRIO DE ARQUITETURA</text>
  <text class="titulo" x="532" y="222" font-size="84">Cava até</text>
  <text class="titulo" x="532" y="312" font-size="84">achar o</text>
  <rect x="538" y="410" width="296" height="9" fill="#f2c53d"/>
  <text class="titulo" x="532" y="402" font-size="84">porquê.</text>
  <text class="texto" x="536" y="468" font-size="27">Um diálogo de 15 a 20 minutos por dia,</text>
  <text class="texto" x="536" y="506" font-size="27">sempre terminando com um desafio.</text>

  <!-- Faixa em zigue-zague, como no site -->
  <path d="M536 552l14-12 14 12 14-12 14 12 14-12 14 12 14-12 14 12 14-12 14 12 14-12 14 12 14-12 14 12 14-12 14 12 14-12 14 12 14-12 14 12 14-12 14 12 14-12 14 12 14-12 14 12 14-12 14 12" fill="none" stroke="#15110c" stroke-width="4" stroke-linejoin="round"/>
  <text class="rotulo" x="536" y="598" font-size="22">lucas-jdev.github.io/pebacast</text>
</svg>
