[project]
name = "pebacast"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=3.0"]
kokoro = ["kokoro>=0.9.4"]
piper = ["piper-tts>=1.3"]
# Prints de antes e depois por seção (scripts/prints.py, ADR 0009).
prints = ["playwright==1.63.0", "pillow==13.0.0"]
# Trailers animados (scripts/pebamotion.py, ADR 0010). Precisa também do ffmpeg no PATH.
motion = ["playwright==1.63.0", "faster-whisper==1.2.1", "scipy>=1.14"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
