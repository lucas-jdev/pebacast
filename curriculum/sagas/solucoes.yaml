id: solucoes
nome: Arquitetura de Soluções
pergunta_central: Quais peças resolvem este problema de negócio e como elas se conectam?
expert: beatriz

referencias_base:
  - id: rozanski
    titulo: "Software Systems Architecture: Working with Stakeholders Using Viewpoints and Perspectives"
    autores: [Nick Rozanski, Eoin Woods]
    edicao: 2ª edição (2011)
    tipo: livro
  - id: eip
    titulo: "Enterprise Integration Patterns: Designing, Building, and Deploying Messaging Solutions"
    autores: [Gregor Hohpe, Bobby Woolf]
    edicao: 1ª edição (2003)
    tipo: livro
  - id: wardley
    titulo: Wardley Maps
    autores: [Simon Wardley]
    ano: 2018
    tipo: livro
  - id: c4
    titulo: The C4 model for visualising software architecture
    autores: [Simon Brown]
    url: https://c4model.com
    tipo: site
  - id: sa-handbook
    titulo: "Solutions Architect's Handbook"
    autores: [Saurabh Shrivastava, Neelanjali Srivastav]
    edicao: 1ª edição (2020)
    tipo: livro
  - id: fowler-strangler
    titulo: Strangler Fig Application
    autores: [Martin Fowler]
    ano: 2004
    tipo: artigo

episodios:
  - id: sl-001
    titulo: "Do problema à solução: o que faz um arquiteto de soluções"
    objetivos:
      - Diferenciar arquitetura de soluções de arquitetura de software e corporativa
      - Identificar os stakeholders de uma iniciativa e o que preocupa cada um
      - Reconhecer quando um requisito é, na verdade, uma solução disfarçada
    pre_requisitos: []
    referencias:
      - fonte: rozanski
        capitulos: [5, 8, 9]
      - fonte: sa-handbook
        capitulos: [2]
    # Conferido em 2026-11-11 pelo sumário da editora e por material de terceiros, e não no livro.
    # Rozanski cap. 5: "Architectural Specializations" e "The Organizational Context" (só o sumário).
    # Rozanski cap. 8: "Problem-Focused Concerns" e "Solution-Focused Concerns", base do terceiro
    # objetivo (sumário e aulas da CSCE 742 baseadas no livro). Rozanski cap. 9: seleção e classes
    # de stakeholders, proxies e grupos. Handbook cap. 2: tipos de arquiteto (corporativo, de
    # soluções, técnico), base do primeiro objetivo. Ressalva: Eoin Woods agrupa arquiteto de
    # soluções e de software em "System Architecture", e o próprio Handbook admite que os papéis se
    # sobrepõem conforme a organização. A fronteira entre os papéis é tratada como debate, não como
    # definição fechada.
    referencias_verificadas: true
    desafio: >-
      Escolha uma iniciativa em andamento na sua empresa, liste os
      stakeholders e escreva, para cada um, a pergunta que ele faria sobre
      a solução. Marque as perguntas que ninguém respondeu ainda.

  - id: sl-002
    titulo: "Comprar, construir ou integrar"
    objetivos:
      - Separar o que diferencia o negócio do que é commodity
      - Usar o estágio de evolução de um componente para decidir entre comprar e construir
      - Reconhecer o custo de construir sob medida o que já virou commodity
    pre_requisitos: [sl-001]
    referencias:
      - fonte: wardley
        capitulos: [2, 3, 4]
    # Conferido em 2026-11-14 no livro, publicado gratuitamente pelo autor no Medium (CC BY-SA 4.0;
    # capítulos de 2016, compilados em 2018), e numa compilação do mesmo texto. Cap. 2: "Finding a
    # path", o eixo de evolução, base do objetivo 2. Cap. 3: "Exploring the map", diferencial
    # contra custo de fazer negócio, base do objetivo 1. Cap. 4: "Doctrine" ("Use appropriate
    # methods" e "Remove duplication and bias"), base dos objetivos 2 e 3. O objetivo 3 dizia
    # "customizar um produto comprado", tema que o livro não trata. "Core vs context" é do Geoffrey
    # Moore; "custom built" é estágio de evolução, não sinônimo de feito em casa; "inertia" é
    # resistência à evolução, não custo de customização.
    referencias_verificadas: true
    desafio: >-
      Liste cinco componentes de um sistema que você conhece e classifique
      cada um como diferencial ou commodity. Aponte um que foi construído
      em casa e poderia ter sido comprado, ou o contrário.

  - id: sl-003
    titulo: "Integração entre sistemas: os quatro estilos"
    objetivos:
      - Comparar transferência de arquivos, banco compartilhado, chamada remota e mensageria
      - Escolher o estilo de integração pelo acoplamento e pela latência aceitáveis
      - Reconhecer o banco compartilhado como integração, e não como atalho
    pre_requisitos: [sl-001]
    referencias:
      - fonte: eip
        capitulos: [2]
    # Conferido em 2026-11-22 pelo sumário da O'Reilly (cap. 2, "Integration Styles") e no site dos
    # autores, enterpriseintegrationpatterns.com, que publica a introdução e os padrões do capítulo.
    # "File Transfer", "Shared Database", "Remote Procedure Invocation" e "Messaging", base do
    # objetivo 1. Os critérios da introdução, entre eles acoplamento e atualidade do dado
    # ("timeliness"), base do objetivo 2. O livro trata o banco compartilhado como um dos quatro
    # estilos, base do objetivo 3; "não é atalho" é leitura da expert. As desvantagens conferidas
    # do banco compartilhado são o esquema único difícil de desenhar e a disputa política entre
    # times; outras não foram conferidas.
    referencias_verificadas: true
    desafio: >-
      Desenhe as integrações de um sistema que você mantém e classifique
      cada uma num dos quatro estilos. Escolha uma e explique o que mudaria
      se ela usasse outro estilo.

  - id: sl-004
    titulo: "Diagramas que comunicam: contexto e contêineres com C4"
    objetivos:
      - Desenhar um diagrama de contexto e um de contêineres
      - Escolher o nível de detalhe certo para cada público
      - Evitar diagramas de caixas e setas sem legenda
    pre_requisitos: [sl-001]
    referencias:
      - fonte: c4
    referencias_verificadas: false
    desafio: >-
      Desenhe o diagrama de contexto de um sistema que você mantém, com os
      usuários e os sistemas externos, e mostre para alguém de fora do time.
      Anote o que precisou explicar em voz alta.

  - id: sl-005
    titulo: "Cenários de qualidade: requisitos não funcionais que o negócio entende"
    objetivos:
      - Transformar um requisito vago como rápido em cenário mensurável
      - Usar cenários para conversar com stakeholders de negócio
      - Priorizar cenários quando eles entram em conflito
    pre_requisitos: [sl-001]
    referencias:
      - fonte: rozanski
        capitulos: [10]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Pegue um requisito não funcional vago de um projeto seu e reescreva-o
      como cenário com estímulo, ambiente e resposta mensurável.

  - id: sl-006
    titulo: "O documento de solução: o que precisa estar lá"
    objetivos:
      - Organizar a descrição da solução em visões e pontos de vista
      - Escolher o que documentar pelo público de cada parte
      - Reconhecer o documento que ninguém lê e por quê
    pre_requisitos: [sl-004]
    referencias:
      - fonte: rozanski
        capitulos: [3, 13]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha um documento de solução do seu time e diga para quem cada seção
      foi escrita. Corte uma seção que não tem leitor.

  - id: sl-007
    titulo: "Cada sistema fala uma língua: tradutores e modelo canônico"
    objetivos:
      - Aplicar o tradutor de mensagens entre sistemas com formatos diferentes
      - Avaliar quando um modelo canônico reduz e quando aumenta o acoplamento
      - Reconhecer o custo de manter o modelo canônico vivo
    pre_requisitos: [sl-003]
    referencias:
      - fonte: eip
        capitulos: [8]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha uma integração de um sistema que você mantém e descreva a
      tradução que acontece entre os dois lados. Diga onde ela mora hoje e
      onde deveria morar.

  - id: sl-008
    titulo: "Migrar sem big bang: o padrão strangler fig"
    objetivos:
      - Planejar a substituição gradual de um sistema legado
      - Escolher por onde começar a interceptar o tráfego
      - Reconhecer o risco de a migração parar no meio para sempre
    pre_requisitos: [sl-003]
    referencias:
      - fonte: fowler-strangler
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha um sistema legado que você conhece e proponha a primeira fatia a
      ser substituída, com o ponto de interceptação e o critério para desligar
      o antigo.

  - id: sl-009
    titulo: "Disponibilidade como requisito da solução"
    objetivos:
      - Traduzir a necessidade do negócio em meta de disponibilidade
      - Identificar os pontos únicos de falha da solução
      - Ponderar o custo de cada nove a mais
    pre_requisitos: [sl-005]
    referencias:
      - fonte: rozanski
        capitulos: [27]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Desenhe a solução de um projeto seu, marque os pontos únicos de falha e
      diga quanto o negócio perde por hora com cada um parado.

  - id: sl-010
    titulo: "Performance e escalabilidade desde o desenho"
    objetivos:
      - Estimar a carga esperada a partir dos números do negócio
      - Identificar o gargalo provável antes de construir
      - Diferenciar escalar para cima de escalar para fora no contexto da solução
    pre_requisitos: [sl-005]
    referencias:
      - fonte: rozanski
        capitulos: [26]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Pegue um fluxo crítico de um projeto seu, estime as requisições no pico
      a partir de um número do negócio e aponte onde ele quebraria primeiro.

  - id: sl-011
    titulo: "Avaliar a arquitetura antes de construir"
    objetivos:
      - Comparar formas de avaliar uma arquitetura, da revisão informal ao método estruturado
      - Usar cenários para encontrar riscos e trade-offs
      - Decidir quanto investir na avaliação pelo risco do projeto
    pre_requisitos: [sl-005, sl-006]
    referencias:
      - fonte: rozanski
        capitulos: [14]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha uma decisão de um projeto seu, rode dois cenários de qualidade
      contra ela e registre um risco que você não tinha visto.
