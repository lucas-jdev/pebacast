id: corporativa
nome: Arquitetura Corporativa
pergunta_central: Como a tecnologia sustenta a estratégia da organização?
expert: otavio

referencias_base:
  - id: elevator
    titulo: "The Software Architect Elevator: Redefining the Architect's Role in the Digital Enterprise"
    autores: [Gregor Hohpe]
    edicao: 1ª edição (2020)
    tipo: livro
  - id: ea-strategy
    titulo: "Enterprise Architecture as Strategy: Creating a Foundation for Business Execution"
    autores: [Jeanne W. Ross, Peter Weill, David C. Robertson]
    edicao: 1ª edição (2006)
    tipo: livro
  - id: togaf
    titulo: The TOGAF Standard
    autores: [The Open Group]
    edicao: 10ª edição (2022)
    url: https://www.opengroup.org/togaf
    tipo: norma
  - id: team-topologies
    titulo: "Team Topologies: Organizing Business and Technology Teams for Fast Flow"
    autores: [Matthew Skelton, Manuel Pais]
    edicao: 1ª edição (2019)
    tipo: livro

episodios:
  - id: co-001
    titulo: "O elevador do arquiteto: da sala da diretoria à sala de máquinas"
    objetivos:
      - Explicar o papel do arquiteto corporativo na ligação entre estratégia e tecnologia
      - Diferenciar arquitetura corporativa de governança burocrática
      - Reconhecer o arquiteto que só circula num andar da organização
    pre_requisitos: []
    referencias:
      - fonte: elevator
        capitulos: [1, 4, 27, 32]
    # Conferido em 2026-11-14 pelo sumário do livro e pelas prévias da O'Reilly, e não no livro.
    # Cap. 1: "The Architect Elevator", base do objetivo 1, e "The Dangers of Riding the
    # Elevator", base do objetivo 3. Cap. 4: "Enterprise Architect or Architect in the
    # Enterprise?", base dos objetivos 2 e 3 ("Visit All Floors"). Caps. 27 "Control Is an
    # Illusion" e 32 "Governance Through Inception": objetivo 2, conferido só pelos títulos das
    # seções. "Penthouse" e "engine room" são do Hohpe; "sala da diretoria" é adaptação nossa.
    # Jardineiro e guia turístico ficam no cap. 2. O Hohpe define o papel pela função, não pelo
    # cargo: não atribuir a ele defesa de TOGAF ou de frameworks. O livro tem 41 capítulos.
    referencias_verificadas: true
    desafio: >-
      Escolha uma decisão estratégica recente da sua empresa e descreva o
      impacto dela no sistema que você mantém. Anote quem fez essa ponte, ou
      se ninguém fez.

  - id: co-002
    titulo: "Modelo operacional: a estratégia que a arquitetura sustenta"
    objetivos:
      - Classificar um modelo operacional pelos eixos de integração e padronização
      - Relacionar o modelo operacional com as escolhas de arquitetura
      - Reconhecer o desalinhamento entre a estratégia declarada e os sistemas existentes
    pre_requisitos: [co-001]
    referencias:
      - fonte: ea-strategy
        capitulos: [2, 3]
    # Conferido em 2026-11-22 pelo sumário do livro, pelas prévias da O'Reilly, por um research
    # briefing do MIT CISR da Jeanne Ross e por notas de leitura, e não no livro. Cap. 2: os quatro
    # modelos (diversificação, coordenação, replicação e unificação) nos eixos de integração e
    # padronização, base do objetivo 1. Cap. 3 (incluído agora): a arquitetura como lógica que
    # reflete o modelo operacional e o core diagram, base do objetivo 2, conferido pelo título e
    # por notas. O objetivo 3 não foi encontrado como tema do livro e entra como opinião do expert.
    referencias_verificadas: true
    desafio: >-
      Classifique a sua empresa num dos quatro modelos operacionais e aponte
      um sistema que reforça essa escolha e outro que a contradiz.

  - id: co-003
    titulo: "Mapa de capacidades de negócio"
    objetivos:
      - Definir capacidade de negócio e diferenciá-la de processo e de sistema
      - Montar um mapa de capacidades de primeiro nível
      - Usar o mapa para enxergar sobreposições no portfólio de aplicações
    pre_requisitos: [co-001]
    referencias:
      - fonte: togaf
    referencias_verificadas: false
    desafio: >-
      Monte o mapa de capacidades de primeiro nível da sua empresa, com no
      máximo dez capacidades, e indique quais sistemas sustentam cada uma.
      Marque as capacidades com mais de um sistema fazendo a mesma coisa.

  - id: co-004
    titulo: "Princípios de arquitetura que alguém usa"
    objetivos:
      - Escrever um princípio de arquitetura com justificativa e implicações
      - Diferenciar princípio de regra e de preferência pessoal
      - Usar os princípios para destravar decisões, em vez de bloqueá-las
    pre_requisitos: [co-002]
    referencias:
      - fonte: togaf
    referencias_verificadas: false
    desafio: >-
      Escreva três princípios de arquitetura para o seu time, cada um com
      uma justificativa e uma implicação concreta. Teste cada um contra uma
      decisão recente.

  - id: co-005
    titulo: "Os estágios de maturidade da arquitetura corporativa"
    objetivos:
      - Descrever os estágios de silos de negócio até a modularidade de negócio
      - Identificar em que estágio uma empresa está
      - Reconhecer o risco de pular estágios
    pre_requisitos: [co-002]
    referencias:
      - fonte: ea-strategy
        capitulos: [4]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Classifique a sua empresa num dos estágios de maturidade e liste duas
      evidências. Diga qual seria o próximo passo realista.

  - id: co-006
    titulo: "Portfólio de aplicações: manter, migrar ou aposentar"
    objetivos:
      - Montar um inventário de aplicações útil para decisão
      - Classificar aplicações pelo valor de negócio e pela saúde técnica
      - Reconhecer o custo de nunca aposentar nada
    pre_requisitos: [co-003]
    referencias:
      - fonte: elevator
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Liste cinco aplicações da sua empresa e classifique cada uma em manter,
      investir, migrar ou aposentar. Justifique a que você aposentaria.

  - id: co-007
    titulo: "Lei de Conway: a arquitetura copia o organograma"
    objetivos:
      - Explicar a lei de Conway e a manobra inversa
      - Relacionar a estrutura dos times com as fronteiras do sistema
      - Reconhecer a carga cognitiva como limite do que um time consegue manter
    pre_requisitos: [co-001]
    referencias:
      - fonte: team-topologies
        capitulos: [2, 3]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Desenhe os times da sua área e os sistemas que cada um mantém. Aponte
      onde o sistema copia uma divisão de times que não faz mais sentido.

  - id: co-008
    titulo: "Topologias de times e modos de interação"
    objetivos:
      - Descrever os quatro tipos fundamentais de time
      - Comparar os três modos de interação entre times
      - Escolher o modo de interação pela fase do trabalho
    pre_requisitos: [co-007]
    referencias:
      - fonte: team-topologies
        capitulos: [5, 7]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Classifique o seu time num dos quatro tipos e liste as interações dele
      com outros times, dizendo qual modo cada uma usa.

  - id: co-009
    titulo: "Roadmap de arquitetura: do estado atual ao desejado"
    objetivos:
      - Descrever as arquiteturas de referência atual e alvo
      - Planejar arquiteturas de transição entre as duas
      - Priorizar as etapas pelo valor e pela dependência
    pre_requisitos: [co-003]
    referencias:
      - fonte: togaf
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escreva em três linhas o estado atual e o desejado de um sistema da sua
      empresa e proponha uma etapa intermediária que já entregue valor.

  - id: co-010
    titulo: "Governança de arquitetura que ninguém contorna"
    objetivos:
      - Explicar o papel de um conselho de arquitetura
      - Diferenciar governança por controle de governança por plataforma e exemplo
      - Reconhecer a governança que vira fila de aprovação
    pre_requisitos: [co-004]
    referencias:
      - fonte: togaf
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Descreva como uma decisão de arquitetura é aprovada na sua empresa e
      conte quantos dias ela leva. Proponha uma regra que dispense aprovação.

  - id: co-011
    titulo: "Modelo de engajamento de TI: a fundação cresce projeto a projeto"
    objetivos:
      - Explicar o modelo de engajamento entre TI e negócio
      - Relacionar cada projeto com a fundação de execução
      - Reconhecer o projeto que resolve o problema local e enfraquece a fundação
    pre_requisitos: [co-005]
    referencias:
      - fonte: ea-strategy
        capitulos: [6]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha um projeto recente da sua empresa e diga o que ele deixou de
      reutilizável para os próximos. Se não deixou nada, diga o que poderia
      ter deixado.
