    autores: [OWASP]
    edicao: a conferir
    tipo: norma

episodios:
  - id: se-001
    titulo: "Pensar como atacante: modelagem de ameaças"
    objetivos:
      - Responder às quatro perguntas da modelagem de ameaças
      - Desenhar um diagrama de fluxo de dados com as fronteiras de confiança
      - Reconhecer por que a modelagem precisa acontecer no desenho, e não no fim
    pre_requisitos: []
    referencias:
      - fonte: shostack
        capitulos: [1, 2, 7]
    # Conferido em 2026-11-11 pelo sumário do livro, pela apresentação da Parte I e por um trecho do
    # cap. 7 publicado pelo autor, e não no livro inteiro. Cap. 1: as quatro perguntas e um diagrama
    # de quadro branco com fronteiras de confiança. Cap. 2: "Types of Diagrams" e "Trust
    # Boundaries", base do diagrama de fluxo de dados. Cap. 7: quando e por onde começar a
    # modelagem, base do terceiro objetivo. A redação de 2014 é "What are you building?" e "Did you
    # do a decent job of analysis?"; "What are we working on?" e "Did we do a good job?" são da
    # formulação posterior e não podem ser atribuídas a este livro.
    referencias_verificadas: true
    desafio: >-
      Desenhe o fluxo de dados de uma funcionalidade que você mantém, marque
      as fronteiras de confiança e anote o que poderia dar errado em cada
      uma delas.

  - id: se-002
    titulo: "STRIDE na prática"
    objetivos:
      - Classificar ameaças nas seis categorias do STRIDE
      - Relacionar cada categoria com a propriedade de segurança que ela viola
      - Priorizar ameaças sem tentar resolver todas de uma vez
    pre_requisitos: [se-001]
    referencias:
      - fonte: shostack
        capitulos: [3, 9, 12]
    # Conferido em 2026-11-14 pelo sumário da O'Reilly, pela prévia do cap. 3 e por capítulos que o
    # autor publica em shostack.org, e não no livro inteiro. Cap. 3: as seis seções de ameaça, de
    # "Spoofing Threats" a "Elevation of Privilege Threats", base do objetivo 1. Cap. 12: "The
    # STRIDE Requirements", com a tabela "STRIDE and AINCAA", base do objetivo 2; o cap. 3 não traz
    # essa tabela. Cap. 9: "Threat-Specific Prioritization Approaches", base do objetivo 3,
    # conferido só pelo título. Probabilidade e impacto é critério do desafio, não do livro, e o
    # DREAD não pode ser recomendado em nome do autor, que o critica. A 2ª edição renumera.
    referencias_verificadas: true
    desafio: >-
      Aplique o STRIDE ao fluxo que você desenhou no desafio anterior e
      escolha a ameaça que trataria primeiro, justificando pela
      probabilidade e pelo impacto.

  - id: se-003
    titulo: "Zero trust: identidade é o novo perímetro"
    objetivos:
      - Explicar os princípios da arquitetura zero trust
      - Diferenciar a segurança baseada em perímetro da baseada em identidade
      - Aplicar o menor privilégio no acesso entre serviços
    pre_requisitos: [se-001]
    referencias:
      - fonte: nist-zt
        secoes: [1, 2, 3]
    # Conferido em 2026-11-22 no documento, aberto em csrc.nist.gov. Seção 2.1: os sete princípios
    # ("tenets"), base do objetivo 1. Seção 1 e 2.2: o perímetro não basta porque quem entra se
    # move lateralmente, e a rede privada inteira não é zona de confiança implícita, base do
    # objetivo 2. Princípios 3 e 4, com menor privilégio por sessão e identidade de serviço, e a
    # seção 3, com os componentes lógicos, base do objetivo 3. "Identidade é o novo perímetro" é
    # bordão do mercado, não do NIST: a política combina identidade com estado do dispositivo e
    # outros atributos, e o documento ainda fala em microperímetros.
    referencias_verificadas: true
    desafio: >-
      Escolha um serviço interno que você mantém e liste quem consegue
      chamá-lo hoje. Proponha como restringir o acesso só a quem precisa.

  - id: se-004
    titulo: "Segredos: gestão, rotação e vazamento"
    objetivos:
      - Identificar onde os segredos de um sistema ficam guardados
      - Aplicar gestão centralizada e rotação de segredos
      - Planejar a resposta a um segredo vazado
    pre_requisitos: [se-001]
    referencias:
      - fonte: owasp-segredos
    referencias_verificadas: false
    desafio: >-
      Faça um inventário dos segredos de um sistema que você mantém: onde
      ficam, quem tem acesso e quando foram trocados pela última vez. Escreva
      o que faria se um deles vazasse hoje.

  - id: se-005
    titulo: "Segurança no ciclo de desenvolvimento"
    objetivos:
      - Reconhecer as categorias de risco mais comuns em aplicações web
      - Posicionar análise estática, dependências e revisão no ciclo de desenvolvimento
      - Equilibrar o bloqueio automático com o tempo de resposta do time
    pre_requisitos: [se-002]
    referencias:
      - fonte: owasp-top10
    referencias_verificadas: false
    desafio: >-
      Escolha três categorias do OWASP Top 10 e confira se o pipeline do seu
      time detecta alguma delas automaticamente. Proponha uma verificação
      para a que não é detectada.

  - id: se-006
    titulo: "Árvores de ataque: pensar no objetivo do atacante"
    objetivos:
      - Construir uma árvore de ataque a partir de um objetivo
      - Usar a árvore para encontrar o caminho mais barato para o atacante
      - Combinar árvores de ataque com STRIDE
    pre_requisitos: [se-002]
    referencias:
      - fonte: shostack
        capitulos: [4]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha um objetivo de atacante contra um sistema seu, como ler os dados
      de outro cliente, e desenhe a árvore até três níveis. Marque o galho
      mais barato.

  - id: se-007
    titulo: "Autenticação: senha, MFA e passkeys"
    objetivos:
      - Comparar fatores de autenticação pela resistência a ataques
      - Aplicar as recomendações atuais para senhas
      - Explicar por que autenticadores resistentes a phishing mudam o jogo
    pre_requisitos: [se-003]
    referencias:
      - fonte: nist-800-63b
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Revise a tela de login de um sistema que você mantém contra as
      recomendações de senha da norma e liste o que mudaria.

  - id: se-008
    titulo: "OAuth e OpenID Connect: delegar sem entregar a senha"
    objetivos:
      - Explicar papéis e fluxos do OAuth 2.0
      - Diferenciar autorização de autenticação e o papel do OpenID Connect
      - Reconhecer configurações inseguras apontadas pelas boas práticas atuais
    pre_requisitos: [se-007]
    referencias:
      - fonte: rfc6749
      - fonte: rfc9700
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha uma integração que usa OAuth no seu sistema e descubra qual
      fluxo ela usa. Confira-a contra as boas práticas atuais.

  - id: se-009
    titulo: "Criptografia aplicada: o que proteger e com qual chave"
    objetivos:
      - "Escolher onde cifrar: em trânsito, em repouso e no campo"
      - Explicar a hierarquia de chaves e por que separar a chave do dado
      - Reconhecer erros comuns, como criptografia feita em casa
    pre_requisitos: [se-004]
    referencias:
      - fonte: owasp-cripto
      - fonte: owasp-chaves
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Liste os dados sensíveis de um sistema que você mantém, diga onde cada
      um é cifrado e onde fica a chave. Marque o que está em claro.

  - id: se-010
    titulo: "Cadeia de suprimentos de software"
    objetivos:
      - Explicar as ameaças entre o código-fonte e o artefato publicado
      - Aplicar os níveis de proveniência do SLSA
      - Reconhecer dependências e pipelines como superfície de ataque
    pre_requisitos: [se-005]
    referencias:
      - fonte: slsa
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Descreva como um artefato do seu time é gerado e publicado e diga em que
      nível do SLSA ele estaria. Aponte o primeiro passo para subir um nível.

  - id: se-011
    titulo: "Ameaças à privacidade"
    objetivos:
      - Diferenciar ameaça de segurança de ameaça à privacidade
      - Aplicar uma ferramenta de privacidade ao modelar ameaças
      - Reconhecer a vinculação e a identificação como danos mesmo sem vazamento
    pre_requisitos: [se-002]
    referencias:
      - fonte: shostack
        capitulos: [6]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha um fluxo com dado pessoal no seu sistema e liste como alguém
      poderia identificar ou vincular uma pessoa sem invadir nada.

  - id: se-012
    titulo: "Requisitos de segurança verificáveis"
    objetivos:
      - Escrever requisitos de segurança que podem ser testados
      - Usar um padrão de verificação para definir o nível de exigência
      - Reconhecer a conformidade de fachada, que passa na auditoria e não protege
    pre_requisitos: [se-005]
    referencias:
      - fonte: shostack
        capitulos: [12]
      - fonte: owasp-asvs
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha uma seção do padrão de verificação que se aplica a um sistema
      seu e marque o que você consegue provar que atende.
