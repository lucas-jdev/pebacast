id: seguranca
nome: Arquitetura de Segurança
pergunta_central: Quem pode fazer o quê, e o que acontece quando alguém tenta o que não deveria?
expert: yasmin

referencias_base:
  - id: shostack
    titulo: "Threat Modeling: Designing for Security"
    autores: [Adam Shostack]
    edicao: 1ª edição (2014)
    tipo: livro
  - id: nist-zt
    titulo: "NIST SP 800-207: Zero Trust Architecture"
    autores: [Scott Rose, Oliver Borchert, Stu Mitchell, Sean Connelly]
    ano: 2020
    url: https://csrc.nist.gov/pubs/sp/800/207/final
    tipo: norma
  - id: owasp-segredos
    titulo: OWASP Secrets Management Cheat Sheet
    autores: [OWASP]
    url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    tipo: site
  - id: owasp-top10
    titulo: OWASP Top 10
    autores: [OWASP]
    edicao: 2021
    url: https://owasp.org/Top10/
    tipo: site
  - id: nist-800-63b
    titulo: "NIST SP 800-63B: Digital Identity Guidelines, Authentication and Lifecycle Management"
    autores: [NIST]
    ano: a conferir (rev. 4)
    tipo: norma
  - id: rfc6749
    titulo: "RFC 6749: The OAuth 2.0 Authorization Framework"
    autores: [Dick Hardt]
    ano: 2012
    tipo: norma
  - id: rfc9700
    titulo: "RFC 9700: Best Current Practice for OAuth 2.0 Security"
    autores: [Torsten Lodderstedt, John Bradley, Andrey Labunets, Daniel Fett]
    ano: 2025
    tipo: norma
  - id: owasp-cripto
    titulo: OWASP Cryptographic Storage Cheat Sheet
    autores: [OWASP]
    tipo: artigo
  - id: owasp-chaves
    titulo: OWASP Key Management Cheat Sheet
    autores: [OWASP]
    tipo: artigo
  - id: slsa
    titulo: "SLSA: Supply-chain Levels for Software Artifacts"
    autores: [OpenSSF]
