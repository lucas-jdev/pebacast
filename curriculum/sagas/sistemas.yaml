id: sistemas
nome: Arquitetura de Sistemas
pergunta_central: Como as partes se comportam juntas, principalmente quando algo falha?
expert: rafael

referencias_base:
  - id: ddia
    titulo: Designing Data-Intensive Applications
    autores: [Martin Kleppmann]
    edicao: 1ª edição (2017)
    tipo: livro
  - id: release-it
    titulo: "Release It!: Design and Deploy Production-Ready Software"
    autores: [Michael T. Nygard]
    edicao: 2ª edição (2018)
    tipo: livro
  - id: falacias
    titulo: Fallacies of Distributed Computing Explained
    autores: [Arnon Rotem-Gal-Oz]
    ano: 2006
    tipo: artigo
  - id: hard-parts
    titulo: "Software Architecture: The Hard Parts"
    autores: [Neal Ford, Mark Richards, Pramod Sadalage, Zhamak Dehghani]
    edicao: 1ª edição (2021)
    tipo: livro
  - id: sre
    titulo: "Site Reliability Engineering: How Google Runs Production Systems"
    autores: [Betsy Beyer, Chris Jones, Jennifer Petoff, Niall Richard Murphy]
    edicao: 1ª edição (2016)
    tipo: livro
  - id: memcache-fb
    titulo: Scaling Memcache at Facebook
    autores: [Rajesh Nishtala et al.]
    ano: 2013
    tipo: artigo
  - id: mqtt5
    titulo: MQTT Version 5.0
    autores: [OASIS]
    ano: 2019
    tipo: norma

episodios:
  - id: si-001
    titulo: "Tudo falha: as falácias da computação distribuída"
    objetivos:
      - Listar as falácias da computação distribuída e o que cada uma esconde
      - Diferenciar falha parcial de falha total
      - Reconhecer por que rede, relógio e processo não são confiáveis
    pre_requisitos: []
    referencias:
      - fonte: ddia
        capitulos: [8]
      - fonte: falacias
    # Conferido em 2026-11-12. Falácias: lido no original (PDF do whitepaper, que reúne os posts do
    # Dr. Dobb's), com as oito falácias e a consequência de cada uma para o arquiteto, base do
    # primeiro objetivo. DDIA cap. 8 (1ª ed.): conferido pelo sumário do livro e por duas leituras
    # independentes (blog do Murat Demirbas e notas de estudo de terceiros), e não no livro. As seções
    # "Faults and Partial Failures", "Unreliable Networks", "Unreliable Clocks" e "Process Pauses"
    # sustentam os objetivos sobre falha parcial versus total e rede, relógio e processo.
    referencias_verificadas: true
    desafio: >-
      Escolha uma chamada de rede de um sistema que você mantém e escreva o
      que acontece se ela demorar trinta segundos, falhar no meio ou for
      executada duas vezes.

  - id: si-002
    titulo: "Replicação: cópias que discordam"
    objetivos:
      - Comparar replicação com líder único, com vários líderes e sem líder
      - Entender o atraso de replicação e as anomalias que ele causa
      - Escolher quando ler da réplica é aceitável
    pre_requisitos: [si-001]
    referencias:
      - fonte: ddia
        capitulos: [5]
    # Conferido em 2026-11-14 pelo sumário da O'Reilly e por notas de leitura, e não no livro.
    # Cap. 5: "Leaders and Followers", "Multi-Leader Replication" e "Leaderless Replication", base
    # do objetivo 1. "Problems with Replication Lag", com "Reading Your Own Writes", "Monotonic
    # Reads" e "Consistent Prefix Reads", base do objetivo 2. "Reading Your Own Writes" e "Solutions
    # for Replication Lag" mostram técnicas, mas o critério de quando ler da réplica é síntese do
    # roteiro, não regra do livro. "Single-Leader Replication" é título da 2ª edição (2026), em
    # que Replication virou o cap. 6; na 1ª a seção é "Leaders and Followers".
    referencias_verificadas: true
    desafio: >-
      Encontre uma tela de um sistema que você conhece que lê de uma réplica,
      ou poderia ler, e descreva o que o usuário veria se a réplica estivesse
      dez segundos atrasada.

  - id: si-003
    titulo: "Particionamento: dividir sem perder o controle"
    objetivos:
      - Comparar particionamento por faixa de chave e por hash
      - Reconhecer partições quentes e como evitá-las
      - Entender o custo de rebalancear e de consultar várias partições
    pre_requisitos: [si-001]
    referencias:
      - fonte: ddia
        capitulos: [6]
    # Conferido em 2026-11-22 pelo sumário e pela prévia da O'Reilly, e não no livro. Cap. 6:
    # "Partitioning by Key Range" e "Partitioning by Hash of Key", base do objetivo 1. "Skewed
    # Workloads and Relieving Hot Spots", base do objetivo 2. "Rebalancing Partitions" e
    # "Partitioning Secondary Indexes by Document" e "...by Term", base do objetivo 3. A
    # profundidade com que o livro trata o custo de cada estratégia e o termo "scatter/gather" não
    # foram conferidos. A 2ª edição (2026) renumera os capítulos: usar a 1ª.
    referencias_verificadas: true
    desafio: >-
      Escolha a maior tabela de um sistema que você mantém e proponha uma
      chave de particionamento. Aponte qual consulta ficaria mais cara com
      essa escolha.

  - id: si-004
    titulo: "Consistência e consenso"
    objetivos:
      - Definir linearizabilidade e diferenciá-la de consistência eventual
      - Entender o que o teorema CAP diz e o que ele não diz
      - Reconhecer quando um problema exige consenso
    pre_requisitos: [si-002]
    referencias:
      - fonte: ddia
        capitulos: [9]
    referencias_verificadas: false
    desafio: >-
      Liste três dados de um sistema que você mantém e decida, para cada um,
      se ele precisa de consistência forte ou se aceita consistência
      eventual. Justifique com o que o usuário perderia.

  - id: si-005
    titulo: "Timeouts, retentativas e circuit breakers"
    objetivos:
      - Reconhecer os antipadrões de estabilidade, como reações em cadeia e integrações sem timeout
      - Aplicar timeout, retentativa com limite e circuit breaker
      - Entender por que retentativa sem idempotência multiplica o problema
    pre_requisitos: [si-001]
    referencias:
      - fonte: release-it
        capitulos: [4, 5]
    referencias_verificadas: false
    desafio: >-
      Escolha uma integração de um sistema que você mantém e confira o
      timeout, a política de retentativa e o que acontece quando o outro
      lado fica fora do ar por dez minutos.

  - id: si-006
    titulo: "Transações e níveis de isolamento"
    objetivos:
      - Explicar as garantias de atomicidade, consistência, isolamento e durabilidade
      - Comparar níveis de isolamento pelas anomalias que eles permitem
      - Reconhecer a anomalia de escrita enviesada num caso real
    pre_requisitos: [si-002]
    referencias:
      - fonte: ddia
        capitulos: [7]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Descubra o nível de isolamento padrão do banco que você usa e escreva
      uma operação do seu sistema que poderia sofrer com ele.

  - id: si-007
    titulo: "Relógios mentem: tempo em sistemas distribuídos"
    objetivos:
      - Diferenciar relógio de parede de relógio monotônico
      - Reconhecer o risco de ordenar eventos pelo horário da máquina
      - Explicar pausas de processo e por que um nó pode achar que ainda é líder
    pre_requisitos: [si-001]
    referencias:
      - fonte: ddia
        capitulos: [8]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Procure no seu sistema uma lógica que compara horários de máquinas
      diferentes e descreva o que aconteceria com um relógio dois segundos
      adiantado.

  - id: si-008
    titulo: "Exatamente uma vez? Idempotência e ordenação de mensagens"
    objetivos:
      - Comparar as garantias de no máximo uma, ao menos uma e exatamente uma vez
      - Projetar consumidores idempotentes
      - Reconhecer quando a ordem das mensagens importa e como preservá-la
    pre_requisitos: [si-005]
    referencias:
      - fonte: ddia
        capitulos: [11]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha um consumidor de mensagens do seu sistema e descreva o que
      acontece se a mesma mensagem chegar duas vezes. Proponha a chave de
      idempotência.

  - id: si-009
    titulo: "Transações distribuídas e sagas"
    objetivos:
      - Explicar o commit em duas fases e por que ele trava sob falha
      - Comparar sagas orquestradas e coreografadas
      - Projetar compensações para os passos de uma saga
    pre_requisitos: [si-004, si-006]
    referencias:
      - fonte: ddia
        capitulos: [9]
      - fonte: hard-parts
        capitulos: [9, 12]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha um processo que atravessa dois serviços ou dois bancos e escreva
      a compensação de cada passo. Aponte o passo que não tem como desfazer.

  - id: si-010
    titulo: "Cache distribuído: invalidação e consistência"
    objetivos:
      - Comparar estratégias de invalidação de cache
      - Reconhecer a debandada quando um item popular expira
      - Avaliar quanto dado velho o negócio tolera
    pre_requisitos: [si-002]
    referencias:
      - fonte: memcache-fb
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha um dado cacheado no seu sistema e diga quanto tempo ele pode
      ficar velho sem causar problema. Confira se a configuração respeita
      isso.

  - id: si-011
    titulo: "Falhas em cascata e sobrecarga"
    objetivos:
      - Explicar como uma falha local se espalha pelo sistema
      - Aplicar descarte de carga e degradação controlada
      - Reconhecer retentativas que transformam lentidão em queda
    pre_requisitos: [si-005]
    referencias:
      - fonte: sre
        capitulos: [21, 22]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Desenhe a cadeia de chamadas de uma requisição do seu sistema e marque
      onde uma lentidão de dez segundos viraria fila. Proponha onde descartar
      carga.

  - id: si-012
    titulo: "IoT com rede instável: MQTT e níveis de QoS"
    objetivos:
      - Comparar os níveis de QoS 0, 1 e 2 do MQTT
      - Usar mensagens retidas e a última vontade para saber o estado de um dispositivo
      - Projetar o armazenamento local para quando a rede some
    pre_requisitos: [si-008]
    referencias:
      - fonte: mqtt5
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha um dado que sai de um equipamento de campo ou de um app no
      celular e diga qual QoS usaria e o que acontece com ele numa queda de
      rede de uma hora.
