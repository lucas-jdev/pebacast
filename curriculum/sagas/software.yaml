id: software
nome: Arquitetura de Software
pergunta_central: Como um sistema é organizado por dentro e por quê?
expert: helena

referencias_base:
  - id: fosa
    titulo: Fundamentals of Software Architecture
    autores: [Mark Richards, Neal Ford]
    edicao: 1ª edição (2020)
    tipo: livro
  - id: nygard-adr
    titulo: Documenting Architecture Decisions
    autores: [Michael Nygard]
    ano: 2011
    tipo: artigo
  - id: hard-parts
    titulo: "Software Architecture: The Hard Parts"
    autores: [Neal Ford, Mark Richards, Pramod Sadalage, Zhamak Dehghani]
    edicao: 1ª edição (2021)
    tipo: livro
  - id: khononov-ddd
    titulo: Learning Domain-Driven Design
    autores: [Vlad Khononov]
    edicao: 1ª edição (2021)
    tipo: livro
  - id: fowler-divida
    titulo: Technical Debt Quadrant
    autores: [Martin Fowler]
    ano: 2009
    tipo: artigo

episodios:
  - id: sw-001
    titulo: "Tudo é trade-off: o que faz um arquiteto de software"
    objetivos:
      - Diferenciar arquitetura de design
      - Entender as expectativas sobre o papel de arquiteto
      - Aplicar a ideia de que toda decisão arquitetural é um trade-off
    pre_requisitos: []
    referencias:
      - fonte: fosa
        capitulos: [1, 2]
    referencias_verificadas: true
    desafio: >-
      Escolha uma decisão técnica recente do seu time e liste pelo menos dois
      ganhos e duas perdas que ela trouxe. Se não encontrar nenhuma perda,
      procure de novo.

  - id: sw-002
    titulo: "Modularidade: coesão, acoplamento e conascência"
    objetivos:
      - Medir coesão e acoplamento de um módulo
      - Classificar formas de conascência e suas intensidades
      - Identificar qual acoplamento vale a pena reduzir primeiro
    pre_requisitos: [sw-001]
    referencias:
      - fonte: fosa
        capitulos: [3]
    # Conferido em 2026-11-08 por resumos independentes do cap. 3 ("Modularity") e não no
    # livro: coesão (tipos e LCOM), acoplamento aferente/eferente, abstração, instabilidade,
    # distância da sequência principal, conascência estática e dinâmica, propriedades da
    # conascência (força, localidade, grau) e regras para reduzi-la. O revisor continua
    # reprovando atribuições que não conseguir confirmar.
    referencias_verificadas: true
    desafio: >-
      Pegue dois módulos de um sistema que você mantém, classifique a
      conascência mais forte entre eles e proponha uma mudança que a
      enfraqueça.

  - id: sw-003
    titulo: "Características arquiteturais: os requisitos que ninguém escreve"
    objetivos:
      - Definir características arquiteturais e diferenciá-las de requisitos funcionais
      - Extrair características a partir de requisitos de negócio
      - Reconhecer que maximizar todas as características é inviável
    pre_requisitos: [sw-001]
    referencias:
      - fonte: fosa
        capitulos: [4, 5, 6]
    # Conferido em 2026-11-14 pelo sumário do livro e pelas prévias da O'Reilly, e não no livro.
    # Cap. 4: a abertura e "Architectural Characteristics (Partially) Listed", base do objetivo 1;
    # "Trade-Offs and Least Worst Architecture", base do objetivo 3. Cap. 5: "Extracting
    # Architecture Characteristics from Domain Concerns", "...from Requirements" e "Case Study:
    # Silicon Sandwiches", base do objetivo 2. Cap. 6: "Measuring and Governing Architecture
    # Characteristics", base do desafio (o que não é medido). O livro pede uma lista curta, não
    # exatamente três características. "Kata" e "Limiting and Prioritizing" são só da 2ª edição.
    referencias_verificadas: true
    desafio: >-
      Liste as três características mais críticas de um sistema que você
      mantém, justificando cada uma com um requisito de negócio, e aponte
      qual delas não é medida hoje.

  - id: sw-004
    titulo: "ADR: decisões que sobrevivem a quem as tomou"
    objetivos:
      - Estruturar um ADR com contexto, decisão e consequências
      - Diferenciar decisão arquitetural de decisão de design
      - Reconhecer os antipadrões de decisão sem registro
    pre_requisitos: [sw-001]
    referencias:
      - fonte: fosa
        capitulos: [19]
      - fonte: nygard-adr
    # Conferido em 2026-11-22 pelo sumário e pela prévia da O'Reilly do cap. 19 e no artigo do
    # Nygard, que está aberto no blog da Cognitect. Cap. 19: "Architecture Decision Records" e
    # "Basic Structure", com o artigo (Title, Status, Context, Decision, Consequences), base do
    # objetivo 1. "Architecturally Significant" e a definição do Nygard (estrutura, características
    # não funcionais, dependências, interfaces, técnicas de construção), base do objetivo 2. Os três
    # antipadrões do cap. e o "aceitar ou reverter às cegas" do Nygard, base do objetivo 3. Só
    # Groundhog Day e Email-Driven Architecture falam de decisão sem justificativa ou sem registro;
    # Covering Your Assets é adiar a decisão por medo. As seções extras do livro (Compliance e
    # Notes) foram conferidas só por notas de leitura. Na 2ª edição o tema é o cap. 21.
    referencias_verificadas: true
    desafio: >-
      Escreva um ADR de uma decisão que o seu time já tomou e nunca
      registrou, incluindo as alternativas que foram descartadas.

  - id: sw-005
    titulo: "Componentes: do requisito às peças da arquitetura"
    objetivos:
      - Identificar componentes a partir dos requisitos e dos papéis do sistema
      - Diferenciar particionamento técnico de particionamento por domínio
      - Reconhecer a armadilha de modelar componentes como entidades do banco
    pre_requisitos: [sw-003]
    referencias:
      - fonte: fosa
        capitulos: [8]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Liste os componentes de um sistema que você mantém e diga se ele está
      particionado por camada técnica ou por domínio. Aponte um componente que
      é só uma tabela com outro nome.

  - id: sw-006
    titulo: "Arquitetura em camadas: quando o simples vira armadilha"
    objetivos:
      - Explicar camadas abertas e fechadas e o isolamento entre elas
      - Reconhecer o antipadrão do sumidouro, a requisição que só atravessa camadas
      - Decidir quando o estilo em camadas ainda é a melhor escolha
    pre_requisitos: [sw-005]
    referencias:
      - fonte: fosa
        capitulos: [10]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha uma funcionalidade de um sistema em camadas que você mantém e
      conte quantas camadas só repassam a chamada sem acrescentar nada.

  - id: sw-007
    titulo: "Bounded contexts: onde um modelo termina e outro começa"
    objetivos:
      - Distinguir subdomínios centrais, de suporte e genéricos
      - Delimitar um bounded context pela linguagem do negócio
      - Escolher um padrão de integração entre contextos
    pre_requisitos: [sw-005]
    referencias:
      - fonte: khononov-ddd
        capitulos: [1, 3, 4]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Pegue uma palavra que muda de sentido entre duas áreas da sua empresa,
      como cliente ou pedido, e desenhe os dois contextos e a tradução entre
      eles.

  - id: sw-008
    titulo: "Agregados: a fronteira da consistência dentro do domínio"
    objetivos:
      - Explicar agregado, entidade e objeto de valor
      - Definir a fronteira de consistência de um agregado
      - Reconhecer agregados grandes demais e o custo que eles trazem
    pre_requisitos: [sw-007]
    referencias:
      - fonte: khononov-ddd
        capitulos: [5, 6]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha uma regra de negócio que precisa ser sempre verdadeira no seu
      sistema e diga qual agregado a protege. Se nenhum proteger, proponha um.

  - id: sw-009
    titulo: "Event-driven: broker, mediator e o código que reage"
    objetivos:
      - Comparar as topologias broker e mediator
      - Organizar o código em torno de eventos em vez de chamadas
      - Reconhecer o custo de depurar um fluxo que ninguém orquestra
    pre_requisitos: [sw-006]
    referencias:
      - fonte: fosa
        capitulos: [14]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha um fluxo de um sistema que você mantém e redesenhe-o como
      eventos. Diga qual topologia usaria e o que ficaria mais difícil de
      acompanhar.

  - id: sw-010
    titulo: "Microsserviços: fronteiras, granularidade e quando não usar"
    objetivos:
      - Delimitar a fronteira de um serviço pelo domínio e pelos dados
      - Avaliar a granularidade pelas forças que separam e que juntam serviços
      - Decidir quando um sistema distribuído não compensa o custo
    pre_requisitos: [sw-007, sw-009]
    referencias:
      - fonte: fosa
        capitulos: [17, 18]
      - fonte: hard-parts
        capitulos: [7]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha dois serviços, ou dois módulos, que você mantém e diga se
      deveriam ser um só ou continuar separados, usando pelo menos uma força
      de cada lado.

  - id: sw-011
    titulo: "Débito técnico: a dívida que você escolhe e a que te escolhe"
    objetivos:
      - Classificar o débito técnico pelos quadrantes de deliberado ou inadvertido e prudente ou imprudente
      - Explicar o débito como juros pagos em cada mudança futura
      - Decidir qual débito pagar primeiro pelo custo de conviver com ele
    pre_requisitos: [sw-004]
    referencias:
      - fonte: fowler-divida
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Liste três débitos técnicos de um sistema que você mantém, classifique
      cada um num quadrante e escolha qual pagaria primeiro, justificando
      pelos juros.
