id: infraestrutura
nome: Arquitetura de Infraestrutura
pergunta_central: Onde e como tudo isso roda, com qual custo e confiabilidade?
expert: jorge

referencias_base:
  - id: iac
    titulo: "Infrastructure as Code: Dynamic Systems for the Cloud Age"
    autores: [Kief Morris]
    edicao: 2ª edição (2020)
    tipo: livro
  - id: sre
    titulo: "Site Reliability Engineering: How Google Runs Production Systems"
    autores: [Betsy Beyer, Chris Jones, Jennifer Petoff, Niall Richard Murphy]
    edicao: 1ª edição (2016)
    url: https://sre.google/sre-book/table-of-contents/
    tipo: livro
  - id: finops
    titulo: "Cloud FinOps: Collaborative, Real-Time Cloud Value"
    autores: [J. R. Storment, Mike Fuller]
    edicao: 2ª edição (2023)
    tipo: livro

episodios:
  - id: in-001
    titulo: "Infraestrutura como código: o que não está em código não existe"
    objetivos:
      - Explicar os benefícios da infraestrutura definida em código
      - Diferenciar infraestrutura configurada à mão de infraestrutura reproduzível
      - Reconhecer o desvio de configuração e como evitá-lo
    pre_requisitos: []
    referencias:
      - fonte: iac
        capitulos: [1, 2]
    # Conferido em 2026-11-11 pelo sumário do livro e pela prévia da O'Reilly, e não no livro.
    # Cap. 1: "From the Iron Age to the Cloud Age", "Benefits of Infrastructure as Code" e as três
    # práticas centrais. Cap. 2: "Configuration Drift" e "Ensure That You Can Repeat Any Process",
    # base dos objetivos sobre reprodutibilidade e desvio de configuração. A cópia impressa traz
    # copyright 2021, embora a O'Reilly date o lançamento em dezembro de 2020.
    referencias_verificadas: true
    desafio: >-
      Liste três recursos de infraestrutura que o seu time usa e diga quais
      estão definidos em código. Para um que não está, escreva o que seria
      preciso para recriá-lo do zero.

  - id: in-002
    titulo: "SLOs: quanta confiabilidade é suficiente"
    objetivos:
      - Diferenciar SLI, SLO e SLA
      - Usar o orçamento de erro para equilibrar confiabilidade e velocidade
      - Reconhecer por que 100% de disponibilidade é a meta errada
    pre_requisitos: [in-001]
    referencias:
      - fonte: sre
        capitulos: [1, 3, 4]
    # Conferido em 2026-11-14 no livro, publicado gratuitamente pelo Google em sre.google. Cap. 4:
    # "Service Level Terminology" ("Indicators", "Objectives", "Agreements"), base do objetivo 1.
    # Cap. 3: "Motivation for Error Budgets" e "Forming Your Error Budget", base do objetivo 2.
    # Cap. 1: "Pursuing Maximum Change Velocity Without Violating a Service's SLO", base do
    # objetivo 3, reforçado na abertura e em "Key Insights" do cap. 3. O Apêndice A, "Availability
    # Table", dá a indisponibilidade por mês (99,9% são 43,2 min, mês de 30 dias); outro mês é
    # aritmética do roteiro. Os 52,56 min de 99,99% no cap. 3 são por ano, não por mês. Cada
    # capítulo tem autores próprios (cap. 1: Treynor Sloss); os quatro nomes são organizadores.
    referencias_verificadas: true
    desafio: >-
      Escolha um serviço que você mantém, defina um SLI e um SLO para ele e
      calcule quantos minutos de indisponibilidade por mês esse SLO permite.

  - id: in-003
    titulo: "Monitoramento de plataforma: alertar sem afogar o time"
    objetivos:
      - Aplicar os quatro sinais de ouro (latência, tráfego, erros e saturação)
      - Diferenciar alerta que exige ação de informação para painel
      - Reconhecer o custo de coletar e guardar tudo
    pre_requisitos: [in-002]
    referencias:
      - fonte: sre
        capitulos: [6]
    # Conferido em 2026-11-22 no livro, publicado gratuitamente pelo Google em sre.google. Cap. 6:
    # "The Four Golden Signals", base do objetivo 1. A distinção entre page, ticket, painel e log,
    # "toda página deve exigir ação" e sintoma contra causa, base do objetivo 2 e do desafio.
    # "As Simple as Possible, No Simpler", a resolução por segundo cara de coletar, guardar e
    # analisar, e a remoção de coleta e alerta pouco usados, base do objetivo 3.
    referencias_verificadas: true
    desafio: >-
      Revise os alertas de um serviço que você mantém e marque os que
      exigem que alguém faça algo agora. Proponha o que fazer com os outros.

  - id: in-004
    titulo: "Backup não é recuperação"
    objetivos:
      - Diferenciar backup de capacidade de restaurar
      - Entender os objetivos de tempo e de ponto de recuperação
      - Reconhecer por que um plano de recuperação que nunca foi testado não é plano
    pre_requisitos: [in-001]
    referencias:
      - fonte: sre
        capitulos: [26]
    referencias_verificadas: false
    desafio: >-
      Descubra quando o banco de dados de um sistema que você mantém foi
      restaurado pela última vez a partir do backup. Se nunca foi, escreva
      o passo a passo de um teste de restauração.

  - id: in-005
    titulo: "FinOps: a fatura também é arquitetura"
    objetivos:
      - Explicar as fases de informar, otimizar e operar do FinOps
      - Relacionar decisões de arquitetura com o custo de nuvem
      - Atribuir custo a times e produtos para que alguém se responsabilize
    pre_requisitos: [in-001]
    referencias:
      - fonte: finops
    referencias_verificadas: false
    desafio: >-
      Encontre os três maiores itens de custo de infraestrutura do seu time
      e, para cada um, aponte a decisão de arquitetura que o explica.

  - id: in-006
    titulo: "Toil: o trabalho que não deveria existir"
    objetivos:
      - Definir toil e diferenciá-lo de trabalho operacional útil
      - Medir quanto tempo o time gasta com toil
      - Priorizar a automação pelo retorno
    pre_requisitos: [in-002]
    referencias:
      - fonte: sre
        capitulos: [5]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Anote por uma semana as tarefas manuais e repetitivas que você faz em
      produção e calcule quantas horas por mês elas custam.

  - id: in-007
    titulo: "Incidentes: quem comanda quando tudo pega fogo"
    objetivos:
      - Separar os papéis de comando, operação e comunicação num incidente
      - Reconhecer os sinais de um incidente sem comando
      - Decidir quando declarar um incidente
    pre_requisitos: [in-003]
    referencias:
      - fonte: sre
        capitulos: [13, 14]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Relembre o último problema sério em produção do seu time e diga quem
      comandou, quem operou e quem comunicou. Se foi a mesma pessoa, proponha
      a divisão.

  - id: in-008
    titulo: "Postmortem sem culpados"
    objetivos:
      - Escrever um postmortem focado em causas sistêmicas
      - Diferenciar responsabilização de culpa
      - Transformar ações do postmortem em mudanças que acontecem de fato
    pre_requisitos: [in-007]
    referencias:
      - fonte: sre
        capitulos: [15]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Pegue um incidente recente e escreva o postmortem em uma página, sem
      citar nomes. Verifique se cada ação tem dono e prazo.

  - id: in-009
    titulo: "Release engineering: deploy como processo, não como evento"
    objetivos:
      - Explicar builds herméticos e reprodutíveis
      - Aplicar implantação gradual com critério de reversão
      - Reconhecer o deploy que depende de uma pessoa específica
    pre_requisitos: [in-001]
    referencias:
      - fonte: sre
        capitulos: [8]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Descreva o caminho de uma mudança do seu time, do merge até a produção,
      e marque cada passo que depende de alguém lembrar de fazer algo.

  - id: in-010
    titulo: "Testar infraestrutura como código"
    objetivos:
      - Aplicar a pirâmide de testes à infraestrutura
      - Diferenciar testes offline, online e de ponta a ponta para pilhas de infraestrutura
      - Reconhecer o custo e o tempo de testar infraestrutura real
    pre_requisitos: [in-001]
    referencias:
      - fonte: iac
        capitulos: [8, 9]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Escolha um trecho de infraestrutura como código que você mantém e
      escreva o primeiro teste que pegaria o erro mais caro que ele pode
      causar.

  - id: in-011
    titulo: "Contêineres e orquestração: o que o cluster resolve e o que ele cobra"
    objetivos:
      - Explicar o que a orquestração de contêineres oferece à aplicação
      - Comparar plataformas de execução de aplicações
      - Reconhecer o custo operacional de manter um cluster
    pre_requisitos: [in-001]
    referencias:
      - fonte: iac
        capitulos: [10, 14]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Liste o que o seu time precisaria operar sozinho se trocasse a
      plataforma atual por um cluster próprio, ou o contrário.

  - id: in-012
    titulo: "Balanceamento de carga: do DNS ao servidor"
    objetivos:
      - Explicar o balanceamento no DNS e na borda
      - Comparar políticas de balanceamento dentro do datacenter
      - Reconhecer o servidor que recebe carga demais por causa da política
    pre_requisitos: [in-002]
    referencias:
      - fonte: sre
        capitulos: [19, 20]
    # Rascunho de 2026-11-22: título, objetivos e fontes a conferir na curadoria.
    referencias_verificadas: false
    desafio: >-
      Desenhe o caminho de uma requisição até o seu serviço e marque cada
      ponto de balanceamento e a política que ele usa.
