# API dos votos do site: Cloudflare Worker + D1 (SQLite). Ver docs/votos.md.
# Sem os secrets da Cloudflare, só os testes rodam; o site esconde os botões enquanto site.votos_api estiver vazio.
name: Votos

on:
  push:
    branches: [main]
    paths:
      - "votos/**"
      - ".github/workflows/votos.yml"
  workflow_dispatch:

concurrency:
  group: votos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  votos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: votos
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Testes
        run: node --test

      - name: Verificar credenciais
        id: credenciais
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Sem CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID: deploy pulado (docs/votos.md)."
          fi

      # O id do banco não fica no repositório: é buscado (ou criado) na conta a cada deploy.
      - name: Preparar o banco
        if: steps.credenciais.outputs.ok == 'true'
        run: |
          id_do_banco() { $WRANGLER d1 list --json | jq -r '.[] | select(.name == "pebacast-votos") | .uuid'; }
          id=$(id_do_banco)
          if [ -z "$id" ]; then
            $WRANGLER d1 create pebacast-votos
            id=$(id_do_banco)
          fi
          sed -i "s/__D1_ID__/$id/" wrangler.toml
          $WRANGLER d1 migrations apply pebacast-votos --remote

      - name: Publicar o Worker
        if: steps.credenciais.outputs.ok == 'true'
        run: |
          $WRANGLER deploy
          # O sal do HMAC dos IPs é gerado uma vez e nunca sai da Cloudflare.
          if ! $WRANGLER secret list --format json | jq -e '.[] | select(.name == "VOTOS_SAL")' >/dev/null; then
            openssl rand -hex 32 | $WRANGLER secret put VOTOS_SAL
          fi

      # Fumaça sem gravar nada: o GET responde e um POST inválido chega até a validação
      # (400 prova rota, origem e sal configurados; 403/503 seriam configuração errada).
      - name: Testar a API publicada
        if: steps.credenciais.outputs.ok == 'true'
        run: |
          api=$(grep -oE 'votos_api: "[^"]*"' ../config/pipeline.yaml | cut -d'"' -f2)
          [ -n "$api" ] || { echo "::notice::site.votos_api vazio; fumaça pulada."; exit 0; }
          sleep 5
          test "$(curl -s -o /dev/null -w '%{http_code}' "$api/votos")" = 200
          for rota in votos recados; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Origin: https://lucas-jdev.github.io" --data '{"episodio":"x"}' "$api/$rota")
            echo "POST /$rota inválido → $status"
            test "$status" = 400
          done
