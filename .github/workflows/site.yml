# Republica o site e o feed quando muda algo que aparece neles, sem depender de episódio novo.
# Usa o mesmo grupo de concorrência da publicação para os dois nunca disputarem o Pages.
name: Publicar site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/podcast/site.py"
      - "src/podcast/publicacao.py"
      - "curriculum/**"
      - "config/**"
  workflow_dispatch:
    inputs:
      todas:
        description: "Avisar o IndexNow de todas as URLs do sitemap (use uma vez, depois de configurar a chave)"
        type: boolean
        default: false

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # A ponta do branch, não o commit que disparou o run: um run que esperou a publicação na fila
      # não pode pôr no ar um main de antes dela e apagar o episódio novo.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar a pipeline
        run: pip install -e .

      - name: Gerar o site e o feed
        run: python -m podcast.publicacao --site _site feed

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar no Pages
        id: deploy
        uses: actions/deploy-pages@v5

      # Só depois do deploy: o IndexNow confere a chave no site já publicado. Nunca derruba o job.
      - name: Avisar os buscadores (IndexNow)
        continue-on-error: true
        env:
          TODAS: ${{ inputs.todas && '--todas' || '' }}
        run: python -m podcast.indexacao --site _site avisar $TODAS
