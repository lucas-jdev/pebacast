# Voz, montagem e publicação (ADR 0006). Disparado pelo push da rotina do roteirista.
# Valida o roteiro de novo antes de gastar TTS; reprovação, fallback ou erro viram issue (os outros
# avisos, como vinheta ausente, abrem pelo Python a issue "Avisos na publicação do <id>"),
# e a issue de reprovação de um episódio é fechada quando ele é publicado.
# Com a cota diária do Gemini esgotada, o episódio aguarda (ADR 0011): o agendamento diário
# tenta de novo depois da renovação da cota, e só passa da verificação se houver episódio aguardando a cota.
# O QA do áudio vai para o resumo da execução; reprovar abre (ou fecha) a issue de incidente
# do episódio pelo próprio Python, sem segurar a publicação. O mesmo vale para os QAs de texto,
# pronúncia e voz. No modo regravar do QA de voz (ADR 0012), a voz reprovada dispara o regravar.yml.
name: Publicar episódio

on:
  push:
    branches: [main]
    paths:
      - "episodios/*/roteiro.json"
      - "episodios/*/noticia.json"
      - "episodios/*/revisoes/**"
  # 08:15 UTC (5h15 em Natal): a cota diária renova à meia-noite do Pacífico, 07:00 ou 08:00 UTC.
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  # Só no agendamento: ele existe para retomar o episódio que aguarda a cota (ADR 0011). Um roteiro
  # reprovado parado na pasta fica de fora, senão ganharia o mesmo comentário na issue todo dia.
  # push e workflow_dispatch não passam por aqui.
  verificar:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      aguardando: ${{ steps.aguardando.outputs.ids }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar a pipeline
        run: pip install -e .

      - name: Listar episódios aguardando a cota
        id: aguardando
        run: |
          ids="$(python -m podcast.publicacao aguardando)"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "Aguardando a cota: ${ids:-nenhum}"

  publicar:
    needs: verificar
    # !cancelled(): no push e no workflow_dispatch o verificar é pulado, e um job pulado em `needs`
    # pularia este também.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.verificar.outputs.aguardando != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # As do topo, mais actions: write, só para o modo regravar do QA de voz disparar o regravar.yml.
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
      actions: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar ffmpeg e espeak-ng
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng

      # O Kokoro (fallback) traz o PyTorch; a versão de CPU é bem menor. O qa-voz não traz torch.
      - name: Instalar a pipeline
        run: pip install -e ".[gemini,kokoro,qa-voz]" --extra-index-url https://download.pytorch.org/whl/cpu

      # O modelo do QA de voz (ADR 0012): a chave é o SHA-256 da config. O Python baixa se faltar e
      # confere o hash antes de carregar, com cache ou sem.
      - name: SHA-256 do modelo do QA de voz
        id: modelo-voz
        run: echo "sha=$(python -c "import yaml; print(yaml.safe_load(open('config/pipeline.yaml', encoding='utf-8'))['qa_voz']['modelo']['sha256'])")" >> "$GITHUB_OUTPUT"

      - name: Modelo do QA de voz (cache)
        uses: actions/cache@v5
        with:
          path: ~/.cache/pebacast/modelos
          key: qa-voz-modelo-${{ steps.modelo-voz.outputs.sha }}

      # Faixa de terceiros: só a versão cifrada fica no repositório (docs/vinheta.md).
      - name: Decifrar a vinheta
        # Se falhar (secret ausente ou errado), o episódio sai sem vinheta e a publicação abre um aviso.
        if: ${{ hashFiles('assets/vinheta.mp3.gpg') != '' }}
        continue-on-error: true
        env:
          VINHETA_SENHA: ${{ secrets.VINHETA_SENHA }}
        run: |
          printf '%s' "$VINHETA_SENHA" | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
            -o assets/vinheta.mp3 -d assets/vinheta.mp3.gpg

      - name: Publicar episódios pendentes
        id: publicar
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m podcast.publicacao publicar --repo "$GITHUB_REPOSITORY" --execucao "$RUN_URL"

      - name: Resumo do QA do áudio
        if: ${{ always() && hashFiles('qualidade.md') != '' }}
        run: cat qualidade.md >> "$GITHUB_STEP_SUMMARY"

      # Também registra a espera pela cota (aguardando_cota.json) e o fim dela, que apaga o arquivo.
      - name: Registrar a publicação no repositório
        run: |
          # Um pathspec sem nenhum arquivo derruba o git add inteiro: um por vez.
          git add -A -- 'episodios/*/publicacao.json' 2>/dev/null || true
          git add -A -- 'episodios/*/aguardando_cota.json' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nada publicado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publicados="$(git diff --cached --name-only --diff-filter=A -- 'episodios/*/publicacao.json' | cut -d/ -f2 | paste -sd, -)"
          if [ -n "$publicados" ]; then
            git commit -m "Publica $publicados"
          else
            git commit -m "Aguarda a cota do Gemini: $(git diff --cached --name-only | cut -d/ -f2 | paste -sd, -)"
          fi
          git pull --rebase origin main
          git push origin main

      # Modo regravar do QA de voz (ADR 0012): só depois do push, porque a regravação lê o publicacao.json
      # do main. No máximo um id, e nenhum se algum episódio ficou aguardando a cota. A regravação entra
      # na fila do grupo publicar e roda depois desta execução.
      - name: Disparar a regravação pedida pelo QA de voz
        if: ${{ hashFiles('relatorio.json') != '' }}
        continue-on-error: true
        run: python -m podcast.qualidade_voz disparar --repo "$GITHUB_REPOSITORY" --execucao "$RUN_URL"

      # O site sai do main depois do rebase: o que entrou enquanto o áudio era gerado também vai ao ar.
      - name: Gerar o site com o main atual
        if: ${{ hashFiles('_site/feed.xml') != '' }}
        run: rm -rf _site && python -m podcast.publicacao --site _site feed

      - name: Preparar o site
        if: ${{ hashFiles('_site/feed.xml') != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar o feed no Pages
        id: deploy
        if: ${{ hashFiles('_site/feed.xml') != '' }}
        uses: ./.github/actions/deploy-pages-com-retentativa

      # Só depois do deploy: o IndexNow confere a chave no site já publicado. Nunca derruba a publicação.
      - name: Avisar os buscadores (IndexNow)
        if: ${{ steps.deploy.outcome == 'success' }}
        continue-on-error: true
        run: python -m podcast.indexacao --site _site avisar

      # Uma issue por episódio, com o id no título: reprovar de novo comenta na mesma,
      # e publicar fecha, porque o problema que ela apontava deixou de existir.
      - name: Atualizar issues
        if: ${{ always() }}
        run: |
          issues_abertas_de() {
            gh issue list --state open --search "\"$1\" in:title" --json number,title \
              --jq ".[] | select(.title | endswith(\": $1\")) | .number"
          }
          if [ -f relatorio.json ]; then
            for id in $(jq -r '.publicados[]' relatorio.json); do
              for numero in $(issues_abertas_de "$id"); do
                gh issue close "$numero" --reason completed --comment "Episódio $id publicado: $RUN_URL"
              done
            done
            for id in $(jq -r '.reprovados | keys[]' relatorio.json); do
              { jq -r --arg id "$id" '.reprovados[$id]' relatorio.json; printf '\nExecução: %s\n' "$RUN_URL"; } > corpo.md
              aberta="$(issues_abertas_de "$id" | head -1)"
              if [ -n "$aberta" ]; then
                gh issue comment "$aberta" --body-file corpo.md
              else
                gh issue create --title "Roteiro reprovado: $id" --label incidente --body-file corpo.md
              fi
            done
          elif [ "${{ steps.publicar.outcome }}" = "failure" ] || [ "${{ job.status }}" = "failure" ]; then
            gh issue create --title "Falha na publicação ($(date -u +%F))" --label incidente \
              --body "A publicação quebrou antes de terminar. Veja o log: $RUN_URL"
          fi
          # O avisos.md só tem fallback de voz; os outros avisos já abriram a issue deles no passo de publicar.
          if [ -f avisos.md ]; then
            printf 'O episódio saiu com o TTS de fallback, sem emoção e com menos vozes.\n\n%s\n\nExecução: %s\n' \
              "$(cat avisos.md)" "$RUN_URL" > corpo.md
            gh issue create --title "Episódio publicado com fallback de voz ($(date -u +%F))" --label incidente --body-file corpo.md
          fi

      - name: Marcar a execução como falha
        if: ${{ steps.publicar.outcome == 'failure' }}
        run: exit 1
