# Voz, montagem e publicação (ADR 0006). Disparado pelo push da rotina do roteirista.
# Valida o roteiro de novo antes de gastar TTS; reprovação, fallback ou erro viram issue,
# e a issue de reprovação de um episódio é fechada quando ele é publicado.
name: Publicar episódio

on:
  push:
    branches: [main]
    paths:
      - "episodios/*/roteiro.json"
      - "episodios/*/noticia.json"
      - "episodios/*/revisoes/**"
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar ffmpeg e espeak-ng
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng

      # O Kokoro (fallback) traz o PyTorch; a versão de CPU é bem menor.
      - name: Instalar a pipeline
        run: pip install -e ".[gemini,kokoro]" --extra-index-url https://download.pytorch.org/whl/cpu

      # Faixa de terceiros: só a versão cifrada fica no repositório (docs/vinheta.md).
      - name: Decifrar a vinheta
        # Se falhar (secret ausente ou errado), o episódio sai sem vinheta e a publicação abre um aviso.
        if: ${{ hashFiles('assets/vinheta.mp3.gpg') != '' }}
        continue-on-error: true
        env:
          VINHETA_SENHA: ${{ secrets.VINHETA_SENHA }}
        run: |
          printf '%s' "$VINHETA_SENHA" | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
            -o assets/vinheta.mp3 -d assets/vinheta.mp3.gpg

      - name: Publicar episódios pendentes
        id: publicar
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m podcast.publicacao publicar --repo "$GITHUB_REPOSITORY"

      - name: Registrar a publicação no repositório
        run: |
          git add episodios/*/publicacao.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nada publicado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publica $(git diff --cached --name-only | cut -d/ -f2 | paste -sd, -)"
          git pull --rebase origin main
          git push origin main

      - name: Preparar o site
        if: ${{ hashFiles('_site/feed.xml') != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar o feed no Pages
        id: deploy
        if: ${{ hashFiles('_site/feed.xml') != '' }}
        uses: actions/deploy-pages@v5

      # Uma issue por episódio, com o id no título: reprovar de novo comenta na mesma,
      # e publicar fecha, porque o problema que ela apontava deixou de existir.
      - name: Atualizar issues
        if: ${{ always() }}
        run: |
          issues_abertas_de() {
            gh issue list --state open --search "\"$1\" in:title" --json number,title \
              --jq ".[] | select(.title | endswith(\": $1\")) | .number"
          }
          if [ -f relatorio.json ]; then
            for id in $(jq -r '.publicados[]' relatorio.json); do
              for numero in $(issues_abertas_de "$id"); do
                gh issue close "$numero" --reason completed --comment "Episódio $id publicado: $RUN_URL"
              done
            done
            for id in $(jq -r '.reprovados | keys[]' relatorio.json); do
              { jq -r --arg id "$id" '.reprovados[$id]' relatorio.json; printf '\nExecução: %s\n' "$RUN_URL"; } > corpo.md
              aberta="$(issues_abertas_de "$id" | head -1)"
              if [ -n "$aberta" ]; then
                gh issue comment "$aberta" --body-file corpo.md
              else
                gh issue create --title "Roteiro reprovado: $id" --body-file corpo.md
              fi
            done
          elif [ "${{ steps.publicar.outcome }}" = "failure" ] || [ "${{ job.status }}" = "failure" ]; then
            gh issue create --title "Falha na publicação ($(date -u +%F))" \
              --body "A publicação quebrou antes de terminar. Veja o log: $RUN_URL"
          fi
          if [ -f avisos.md ]; then
            printf 'O episódio saiu com o TTS de fallback, sem emoção e com menos vozes.\n\n%s\n\nExecução: %s\n' \
              "$(cat avisos.md)" "$RUN_URL" > corpo.md
            gh issue create --title "Episódio publicado com fallback de voz ($(date -u +%F))" --body-file corpo.md
          fi

      - name: Marcar a execução como falha
        if: ${{ steps.publicar.outcome == 'failure' }}
        run: exit 1
