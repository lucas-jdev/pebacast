# Temporário: troca o áudio publicado do sw-002 pela v2 regravada, mantendo a URL do feed.
name: Substituir áudio sw-002

on:
  push:
    branches: [regravar/sw-002]

permissions:
  contents: write

jobs:
  substituir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: episodio-sw-002
    steps:
      - name: Trocar o asset
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern pebacast-sw-002-v2.mp3 --repo "$GITHUB_REPOSITORY"
          mv pebacast-sw-002-v2.mp3 pebacast-sw-002.mp3
          gh release upload "$TAG" pebacast-sw-002.mp3 --clobber --repo "$GITHUB_REPOSITORY"
          gh release delete-asset "$TAG" pebacast-sw-002-v2.mp3 --yes --repo "$GITHUB_REPOSITORY"
