# Prints de antes e depois por seção (ADR 0009), passo 1 de 2.
# Roda o código do PR, inclusive de fork, só com leitura. Guarda num artefato os pares que mudaram
# e o manifesto; quem comenta no PR é o workflow Comentar prints, com o código do main.
name: Capturar prints

on:
  pull_request:
    paths:
      - "site/**"
      - "src/podcast/site.py"

concurrency:
  group: capturar-prints-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # O merge do PR com o main: o primeiro pai é o main exato contra o qual o PR é comparado.
      - uses: actions/checkout@v7
        with:
          path: depois
          fetch-depth: 2
          persist-credentials: false

      - name: Preparar o main
        run: git -C depois worktree add --detach ../antes HEAD^1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: depois/pyproject.toml

      - name: Instalar a pipeline e o Playwright
        run: |
          pip install -e "./depois[prints]"
          python -m playwright install --with-deps chromium

      - name: Gerar os dois sites
        run: |
          for lado in antes depois; do
            (cd "$lado" && PYTHONPATH=src python -m podcast.publicacao --site "$RUNNER_TEMP/site-$lado" feed >/dev/null)
          done

      - name: Fotografar as seções
        # Normal: menos de 2 minutos. Cada página tem teto de 60 s e uma nova tentativa (#136): se
        # travar duas vezes, falha em até uns 2 min, com a página, o viewport e o lado no log. Os 6 min
        # são a rede de segurança se até isso travar.
        timeout-minutes: 6
        env:
          DEBUG: pw:api
        run: |
          for lado in antes depois; do
            python depois/scripts/prints.py capturar --site "$RUNNER_TEMP/site-$lado" --saida "$RUNNER_TEMP/capturas-$lado" \
              --lado "$lado" --diagnostico "$RUNNER_TEMP/prints-diagnostico" >/dev/null
          done

      # Só existe quando uma página estourou o teto: trace do Playwright, console e processos do navegador.
      - name: Guardar o diagnóstico da trava
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: prints-diagnostico
          path: ${{ runner.temp }}/prints-diagnostico/
          if-no-files-found: ignore
          retention-days: 7

      - name: Comparar
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          python depois/scripts/prints.py comparar "$RUNNER_TEMP/capturas-antes" "$RUNNER_TEMP/capturas-depois" \
            --saida prints --pr "$PR"

      - uses: actions/upload-artifact@v7
        with:
          name: prints
          path: prints/
          if-no-files-found: error
          retention-days: 7
