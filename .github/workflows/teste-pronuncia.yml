# Teste cego de pronúncia no Gemini (experimentos/teste-pronuncia).
# Cada variante do arquivo é uma requisição: com três variantes, o teste gasta 3 das 10
# requisições diárias do free tier, e o episódio do dia (4 a 5) ainda cabe.
# As amostras anônimas vão para um pré-release, para ouvir no celular; o gabarito, para um artefato.
name: Teste de pronúncia

on:
  workflow_dispatch:
    inputs:
      experimento:
        description: "Arquivo do experimento"
        required: true
        type: string
        default: experimentos/teste-pronuncia/pebacast.yaml

concurrency:
  group: teste-pronuncia
  cancel-in-progress: false

permissions:
  contents: write

env:
  EXPERIMENTO: ${{ inputs.experimento }}
  GH_TOKEN: ${{ github.token }}
  TAG: teste-pronuncia-${{ github.run_id }}

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Instalar a pipeline
        run: pip install -e ".[gemini]"

      - name: Gerar as amostras
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m podcast.teste_pronuncia --saida saida gerar --teste "$EXPERIMENTO"

      - name: Publicar as amostras num pré-release
        run: |
          gh release create "$TAG" saida/amostras/*.mp3 --prerelease --target "$GITHUB_SHA" \
            --title "Teste de pronúncia ($GITHUB_RUN_ID)" \
            --notes "Amostras anônimas de $EXPERIMENTO. Conte, em cada uma, quantas frases saíram com a pronúncia certa."

      - uses: actions/upload-artifact@v7
        with:
          name: gabarito
          path: saida/gabarito.json
          retention-days: 30

      - name: Resumo
        run: |
          { echo "## Teste de pronúncia"; echo
            echo "Ouça as amostras em $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG, sem abrir o artefato **gabarito**."
            echo "Conte quantas frases de cada amostra saíram com a pronúncia certa e revele com:"; echo
            echo '```'; echo "python -m podcast.teste_pronuncia --saida <pasta com o gabarito.json> revelar A=4 B=1 C=3"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
