# Regrava o áudio de um episódio já publicado, em dois passos (ADR 0008).
# "regravar" anexa uma candidata ao release para ouvir; "substituir" troca o áudio no ar por ela,
# mantendo URL, GUID e data de publicação.
name: Regravar áudio

on:
  workflow_dispatch:
    inputs:
      episodio:
        description: "Id do episódio já publicado (ex.: sw-002)"
        required: true
        type: string
      acao:
        description: "regravar gera uma candidata para ouvir; substituir põe a candidata no ar"
        required: true
        type: choice
        options: [regravar, substituir]
        default: regravar

# Mesmo grupo da publicação: os dois mexem no release, no publicacao.json e no Pages.
concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  # O input entra por variável de ambiente, nunca interpolado no shell.
  EPISODIO: ${{ inputs.episodio }}
  GH_TOKEN: ${{ github.token }}

jobs:
  regravar:
    if: ${{ inputs.acao == 'regravar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Sem o Kokoro: a regravação não tem fallback.
      - name: Instalar a pipeline
        run: pip install -e ".[gemini]"

      - name: Decifrar a vinheta
        if: ${{ hashFiles('assets/vinheta.mp3.gpg') != '' }}
        env:
          VINHETA_SENHA: ${{ secrets.VINHETA_SENHA }}
        run: |
          printf '%s' "$VINHETA_SENHA" | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
            -o assets/vinheta.mp3 -d assets/vinheta.mp3.gpg

      - name: Regravar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m podcast.regravacao regravar "$EPISODIO" --repo "$GITHUB_REPOSITORY" | tee saida.txt
          { echo "## Candidata do $EPISODIO"; echo; cat saida.txt; echo
            echo "Se ficou melhor, rode este workflow de novo com **substituir**."; } >> "$GITHUB_STEP_SUMMARY"

  substituir:
    if: ${{ inputs.acao == 'substituir' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Instalar a pipeline
        run: pip install -e .

      - name: Substituir o áudio publicado
        run: python -m podcast.regravacao --site _site substituir "$EPISODIO" --repo "$GITHUB_REPOSITORY"

      - name: Registrar no repositório
        run: |
          git add "episodios/$EPISODIO/publicacao.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regrava o áudio do $EPISODIO"
          git pull --rebase origin main
          git push origin main

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar o feed no Pages
        id: deploy
        uses: actions/deploy-pages@v5
