# Regrava o áudio de um episódio já publicado, em dois passos (ADR 0008).
# "regravar" anexa uma candidata ao release para ouvir, com o QA do áudio e os laudos de pronúncia
# e de voz no resumo, e comenta o laudo de voz na issue de voz aberta do episódio; "substituir" guarda
# o áudio no ar como -anterior.mp3 e troca pela candidata, mantendo URL, GUID e data de publicação,
# e fecha as issues de incidente (áudio e voz) do episódio se a candidata passou.
# Também é disparado pelo publicar.yml no modo regravar do QA de voz (ADR 0012), sempre com acao=regravar.
name: Regravar áudio

on:
  workflow_dispatch:
    inputs:
      episodio:
        description: "Id do episódio já publicado (ex.: sw-002)"
        required: true
        type: string
      acao:
        description: "regravar gera uma candidata para ouvir; substituir põe a candidata no ar"
        required: true
        type: choice
        options: [regravar, substituir]
        default: regravar

# Mesmo grupo da publicação: os dois mexem no release, no publicacao.json e no Pages.
concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

env:
  # O input entra por variável de ambiente, nunca interpolado no shell.
  EPISODIO: ${{ inputs.episodio }}
  GH_TOKEN: ${{ github.token }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  regravar:
    if: ${{ inputs.acao == 'regravar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Sem o Kokoro: a regravação não tem fallback.
      - name: Instalar a pipeline
        run: pip install -e ".[gemini,qa-voz]"

      # O modelo do QA de voz (ADR 0012): a chave é o SHA-256 da config. O Python baixa se faltar e
      # confere o hash antes de carregar, com cache ou sem.
      - name: SHA-256 do modelo do QA de voz
        id: modelo-voz
        run: echo "sha=$(python -c "import yaml; print(yaml.safe_load(open('config/pipeline.yaml', encoding='utf-8'))['qa_voz']['modelo']['sha256'])")" >> "$GITHUB_OUTPUT"

      - name: Modelo do QA de voz (cache)
        uses: actions/cache@v5
        with:
          path: ~/.cache/pebacast/modelos
          key: qa-voz-modelo-${{ steps.modelo-voz.outputs.sha }}

      - name: Decifrar a vinheta
        if: ${{ hashFiles('assets/vinheta.mp3.gpg') != '' }}
        env:
          VINHETA_SENHA: ${{ secrets.VINHETA_SENHA }}
        run: |
          printf '%s' "$VINHETA_SENHA" | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 0 \
            -o assets/vinheta.mp3 -d assets/vinheta.mp3.gpg

      - name: Regravar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m podcast.regravacao --execucao "$RUN_URL" regravar "$EPISODIO" --repo "$GITHUB_REPOSITORY" | tee saida.txt
          { echo "## Candidata do $EPISODIO"; echo; cat saida.txt; echo; cat qualidade.md; echo
            echo "Se ficou melhor, rode este workflow de novo com **substituir**."; } >> "$GITHUB_STEP_SUMMARY"

  substituir:
    if: ${{ inputs.acao == 'substituir' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Instalar a pipeline
        run: pip install -e .

      - name: Substituir o áudio publicado
        run: |
          python -m podcast.regravacao --site _site --execucao "$RUN_URL" substituir "$EPISODIO" --repo "$GITHUB_REPOSITORY"
          if [ -f qualidade.md ]; then cat qualidade.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Registrar no repositório
        run: |
          git add "episodios/$EPISODIO/publicacao.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regrava o áudio do $EPISODIO"
          git pull --rebase origin main
          git push origin main

      # O site sai do main depois do rebase: o que entrou enquanto o áudio era gerado também vai ao ar.
      - name: Gerar o site com o main atual
        run: rm -rf _site && python -m podcast.publicacao --site _site feed

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar o feed no Pages
        id: deploy
        uses: ./.github/actions/deploy-pages-com-retentativa
