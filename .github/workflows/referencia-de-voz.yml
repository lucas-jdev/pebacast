# Impressão de voz de referência do QA de voz (ADR 0012): mede os episódios indicados e abre um PR
# com o config/vozes-referencia.json novo. Nunca faz push no main: a referência só muda depois que o
# Lucas revisa o PR. Quando rodar: na estreia de uma persona, depois de ouvir o episódio, e no fim da
# fase aviso, só com os episódios marcados como bons.
name: Referência de voz

on:
  workflow_dispatch:
    inputs:
      episodios:
        description: "Episódios ouvidos e aprovados, separados por espaço (ex.: sw-002 in-001)"
        required: true
        type: string

concurrency:
  group: referencia-de-voz
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # O input entra por variável de ambiente, nunca interpolado no shell.
      EPISODIOS: ${{ inputs.episodios }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Instalar a pipeline
        run: pip install -e ".[qa-voz]"

      - name: SHA-256 do modelo do QA de voz
        id: modelo-voz
        run: echo "sha=$(python -c "import yaml; print(yaml.safe_load(open('config/pipeline.yaml', encoding='utf-8'))['qa_voz']['modelo']['sha256'])")" >> "$GITHUB_OUTPUT"

      - name: Modelo do QA de voz (cache)
        uses: actions/cache@v5
        with:
          path: ~/.cache/pebacast/modelos
          key: qa-voz-modelo-${{ steps.modelo-voz.outputs.sha }}

      # Um id por palavra; o Python recusa o que não tiver a forma de um id de episódio (sw-002).
      - name: Medir os episódios
        run: |
          read -ra ids <<< "$EPISODIOS"
          python -m podcast.qualidade_voz referencia --repo "$GITHUB_REPOSITORY" --episodios "${ids[@]}"

      - name: Abrir o PR
        run: |
          if git diff --quiet -- config/vozes-referencia.json; then
            echo "A referência não mudou."
            exit 0
          fi
          ramo="referencia-de-voz/$GITHUB_RUN_ID"
          git switch -c "$ramo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/vozes-referencia.json
          git commit -m "Referência de voz: $EPISODIOS"
          git push origin "$ramo"
          printf '%s\n' \
            "Referência de voz medida com: $EPISODIOS." \
            "" \
            "Revise antes de mergear: a referência só deve ter episódios que você ouviu e marcou como bons (ADR 0012)." \
            "" \
            "Execução: $RUN_URL" > corpo.md
          gh pr create --base main --head "$ramo" --title "Referência de voz: $EPISODIOS" --body-file corpo.md
